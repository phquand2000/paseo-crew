<text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636e">Every step is a seat's own call. The desk records it, moves the copy, and carries the letter.</text>
