<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="A lane end to end: the Supervisor opens it and a Lead takes a working copy; the Lead starts tasks and reviews; a Peer hands work back; the Lead accepts it in place or through the merge queue, or sends it back; the Lead reports ready and the Supervisor closes the lane over the gate.">
