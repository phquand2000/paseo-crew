<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="open_lane opens a lane at once, or leaves it waiting until the lanes it names land; drop_lane closes a waiting lane. An open lane can be reported ready, put on hold until resume_lane, or held for your approval. land_lane merges your base in if it moved, runs the gate and the risk rules&#x27; checks, waits for you on a path you asked to see, and lands the lane; drop_lane closes it without landing. At close the Lead is kept until it is released.">
<title>open_lane opens a lane at once, or leaves it waiting until the lanes it names land; drop_lane closes a waiting lane. An open lane can be reported ready, put on hold until resume_lane, or held for your approval. land_lane merges your base in if it moved, runs the gate and the risk rules' checks, waits for you on a path you asked to see, and lands the lane; drop_lane closes it without landing. At close the Lead is kept until it is released.</title>
<style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--soft:#e6eaef;--ink:#1f2328;--muted:#59636e;--faint:#818b98;--shadow:rgba(31,35,40,0.10);--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26;}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--soft:#262c36;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--shadow:rgba(0,0,0,0);--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72;}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;white-space:pre}.canvas{fill:var(--bg);stroke:var(--line)}.h1{font-size:21px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.group{fill:var(--panel);stroke:var(--line)}.group-label{font-size:11px;font-weight:650;letter-spacing:0.08em;fill:var(--muted)}.node{stroke-width:1.4;filter:drop-shadow(0 1px 2px var(--shadow))}.title{font-size:14px;font-weight:620}.sub{font-size:12px;fill:var(--muted)}.note{font-size:12px;fill:var(--muted)}.strong{fill:var(--ink);font-weight:620}.edge{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}.pill-text{font-size:11.5px;font-weight:620}.chip{stroke-width:1}.chip-text{font-size:11px;font-weight:560}.badge-text{font-size:11px;font-weight:700;fill:var(--bg)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="599" rx="18"/>
<text class="h1" x="32" y="46">A lane, from open to closed</text>
<text class="lede" x="32" y="70">Many lanes can be open at once. Each goes through three statuses, and land_lane lands it in four steps.</text>
<text class="sub mono" x="60" y="256" text-anchor="middle">open_lane</text>
<rect class="node" x="150" y="110" width="190" height="58" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="245.0" y="126.0" text-anchor="middle" style="fill:var(--slate-ink)">waiting</text>
<text class="sub" x="245.0" y="145.0" text-anchor="middle">until the lanes it</text>
<text class="sub" x="245.0" y="162.0" text-anchor="middle">names have landed</text>
<rect class="node" x="400" y="197" width="190" height="58" rx="10" style="fill:var(--blue-fill);stroke-opacity:0.55;stroke:var(--blue)"/>
<text class="title" x="495.0" y="213.0" text-anchor="middle" style="fill:var(--blue-ink)">open</text>
<text class="sub" x="495.0" y="232.0" text-anchor="middle">a Lead, a branch,</text>
<text class="sub" x="495.0" y="249.0" text-anchor="middle">a working copy</text>
<rect class="node" x="720" y="197" width="200" height="58" rx="10" style="fill:var(--violet-fill);stroke-opacity:0.55;stroke:var(--violet)"/>
<text class="title" x="820.0" y="213.0" text-anchor="middle" style="fill:var(--violet-ink)">closed</text>
<text class="sub" x="820.0" y="232.0" text-anchor="middle">landed, or dropped;</text>
<text class="sub" x="820.0" y="249.0" text-anchor="middle">the Lead is kept</text>
<rect class="group" x="150" y="290" width="770" height="124" rx="14"/>
<text class="group-label" x="166" y="314">WHILE IT IS OPEN</text>
<rect class="node" x="170" y="330" width="230" height="62" rx="10" style="fill:var(--blue-fill);stroke-opacity:0.55;stroke:var(--blue)"/>
<text class="title" x="285.0" y="348.0" text-anchor="middle" style="fill:var(--blue-ink)">reported ready</text>
<text class="sub" x="285.0" y="367.0" text-anchor="middle">report ready; amend_lane</text>
<text class="sub" x="285.0" y="384.0" text-anchor="middle">takes it away</text>
<rect class="node" x="420" y="330" width="230" height="62" rx="10" style="fill:var(--violet-fill);stroke-opacity:0.55;stroke:var(--violet)"/>
<text class="title" x="535.0" y="348.0" text-anchor="middle" style="fill:var(--violet-ink)">on hold</text>
<text class="sub" x="535.0" y="367.0" text-anchor="middle">hold_lane, or a question;</text>
<text class="sub" x="535.0" y="384.0" text-anchor="middle">until resume_lane</text>
<rect class="node" x="670" y="330" width="230" height="62" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="785.0" y="348.0" text-anchor="middle" style="fill:var(--slate-ink)">held for you</text>
<text class="sub" x="785.0" y="367.0" text-anchor="middle">lands once you approve;</text>
<text class="sub" x="785.0" y="384.0" text-anchor="middle">a new commit drops it</text>
<rect class="group" x="150" y="434" width="770" height="136" rx="14"/>
<text class="group-label" x="166" y="458">LAND_LANE, IN ORDER</text>
<rect class="node" x="170" y="476" width="168" height="62" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="254.0" y="494.0" text-anchor="middle" style="fill:var(--teal-ink)">merge your base</text>
<text class="sub" x="254.0" y="513.0" text-anchor="middle">if it moved; a</text>
<text class="sub" x="254.0" y="530.0" text-anchor="middle">conflict: the Lead's</text>
<circle cx="170" cy="476" r="11" style="fill:var(--teal)"/>
<text class="badge-text" x="170" y="480" text-anchor="middle">1</text>
<rect class="node" x="358" y="476" width="168" height="62" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="442.0" y="494.0" text-anchor="middle" style="fill:var(--teal-ink)">run the gate</text>
<text class="sub" x="442.0" y="513.0" text-anchor="middle">and the risk rules'</text>
<text class="sub" x="442.0" y="530.0" text-anchor="middle">checks; red refuses</text>
<circle cx="358" cy="476" r="11" style="fill:var(--teal)"/>
<text class="badge-text" x="358" y="480" text-anchor="middle">2</text>
<rect class="node" x="546" y="476" width="168" height="62" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="630.0" y="494.0" text-anchor="middle" style="fill:var(--slate-ink)">your approval</text>
<text class="sub" x="630.0" y="513.0" text-anchor="middle">only for paths</text>
<text class="sub" x="630.0" y="530.0" text-anchor="middle">you asked to see</text>
<circle cx="546" cy="476" r="11" style="fill:var(--slate)"/>
<text class="badge-text" x="546" y="480" text-anchor="middle">3</text>
<rect class="node" x="734" y="476" width="168" height="62" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="818.0" y="494.0" text-anchor="middle" style="fill:var(--teal-ink)">land</text>
<text class="sub" x="818.0" y="513.0" text-anchor="middle">on your base,</text>
<text class="sub" x="818.0" y="530.0" text-anchor="middle">as landAs says</text>
<circle cx="734" cy="476" r="11" style="fill:var(--teal)"/>
<text class="badge-text" x="734" y="480" text-anchor="middle">4</text>
<path class="edge" d="M69,226 L400,226" style="stroke-opacity:0.75;stroke:var(--slate)" marker-end="url(#a-slate)"/>
<path class="edge" d="M60,217 L60.0,147.0 Q60,139 68.0,139.0 L150,139" style="stroke-opacity:0.75;stroke:var(--slate)" marker-end="url(#a-slate)"/>
<path class="edge" d="M340,139 L487.0,139.0 Q495,139 495.0,147.0 L495,197" style="stroke-opacity:0.75;stroke:var(--slate)" marker-end="url(#a-slate)"/>
<path class="edge dash" d="M245,110 L245.0,96.0 Q245,88 253.0,88.0 L812.0,88.0 Q820,88 820.0,96.0 L820,197" style="stroke-opacity:0.75;stroke:var(--slate)" marker-end="url(#a-slate)"/>
<path class="edge" d="M590,226 L720,226" style="stroke-opacity:0.75;stroke:var(--violet)" marker-end="url(#a-violet)"/>
<path class="edge dash" d="M495,255 L495,290" style="stroke-opacity:0.75;stroke:var(--blue)"/>
<path class="edge" d="M338,507 L358,507" style="stroke-opacity:0.75;stroke:var(--slate)" marker-end="url(#a-slate)"/>
<path class="edge" d="M526,507 L546,507" style="stroke-opacity:0.75;stroke:var(--slate)" marker-end="url(#a-slate)"/>
<path class="edge" d="M714,507 L734,507" style="stroke-opacity:0.75;stroke:var(--slate)" marker-end="url(#a-slate)"/>
<circle cx="60" cy="226" r="9" style="fill:var(--slate)"/>
<rect x="194.2" y="216" width="71.7" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="230" y="230" text-anchor="middle" style="fill:var(--slate-ink)">opens now</text>
<rect x="78.0" y="129" width="35.9" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="96" y="143" text-anchor="middle" style="fill:var(--slate-ink)">after</text>
<rect x="395.2" y="129" width="49.7" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="420" y="143" text-anchor="middle" style="fill:var(--slate-ink)">its turn</text>
<rect x="527.6" y="78" width="64.9" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="560" y="92" text-anchor="middle" style="fill:var(--slate-ink)">drop_lane</text>
<rect x="622.6" y="202" width="64.9" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="655" y="216" text-anchor="middle" style="fill:var(--violet-ink)">land_lane</text>
<rect x="622.6" y="230" width="64.9" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="655" y="244" text-anchor="middle" style="fill:var(--violet-ink)">drop_lane</text>
</svg>
