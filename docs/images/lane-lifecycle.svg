<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" role="img" aria-label="A lane, end to end: the Supervisor opens a lane and a working copy; the Lead starts tasks and reviews, accepts, and reports ready after the lane gate; the Supervisor closes the lane, and the desk merges the base into the lane, runs the gate on that, and fast-forwards the base. Any failure refuses the landing and leaves the lane open.">
<title>A lane, end to end: the Supervisor opens a lane and a working copy; the Lead starts tasks and reviews, accepts, and reports ready after the lane gate; the Supervisor closes the lane, and the desk merges the base into the lane, runs the gate on that, and fast-forwards the base. Any failure refuses the landing and leaves the lane open.</title>
<style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--soft:#e6eaef;--ink:#1f2328;--muted:#59636e;--faint:#818b98;--shadow:rgba(31,35,40,0.10);--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26;}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--soft:#262c36;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--shadow:rgba(0,0,0,0);--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72;}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;white-space:pre}.canvas{fill:var(--bg);stroke:var(--line)}.h1{font-size:21px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.group{fill:var(--panel);stroke:var(--line)}.group-label{font-size:11px;font-weight:650;letter-spacing:0.08em;fill:var(--muted)}.node{stroke-width:1.4;filter:drop-shadow(0 1px 2px var(--shadow))}.title{font-size:14px;font-weight:620}.sub{font-size:12px;fill:var(--muted)}.note{font-size:12px;fill:var(--muted)}.strong{fill:var(--ink);font-weight:620}.edge{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}.pill-text{font-size:11.5px;font-weight:620}.chip{stroke-width:1}.chip-text{font-size:11px;font-weight:560}.badge-text{font-size:11px;font-weight:700;fill:var(--bg)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="769" rx="18"/>
<text class="h1" x="32" y="46">A lane, end to end</text>
<text class="lede" x="32" y="70">Every step is a seat's own call. The desk records it, moves the working copy, and carries the letter.</text>
<rect class="group" x="24" y="96" width="220" height="650" rx="14" style="fill:var(--violet-fill);stroke:var(--violet);stroke-opacity:0.35"/>
<text class="group-label" x="40" y="120" style="fill:var(--violet-ink)">SUPERVISOR</text>
<rect class="group" x="252" y="96" width="220" height="650" rx="14" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.35"/>
<text class="group-label" x="268" y="120" style="fill:var(--blue-ink)">LEAD</text>
<rect class="group" x="480" y="96" width="220" height="650" rx="14" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.35"/>
<text class="group-label" x="496" y="120" style="fill:var(--green-ink)">PEER · REVIEWER</text>
<rect class="group" x="708" y="96" width="228" height="650" rx="14" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.35"/>
<text class="group-label" x="724" y="120" style="fill:var(--teal-ink)">DESK</text>
<rect class="node" x="42" y="140" width="184" height="58" rx="10" style="fill:var(--violet-fill);stroke:var(--violet)"/>
<text class="title" x="134" y="157" text-anchor="middle" style="fill:var(--violet-ink)">open_lane</text>
<text class="sub" x="134" y="176" text-anchor="middle">outcome, acceptance,</text>
<text class="sub" x="134" y="193" text-anchor="middle">out of scope</text>
<rect class="node" x="730" y="140" width="184" height="58" rx="10" style="fill:var(--teal-fill);stroke:var(--teal)"/>
<text class="title" x="822" y="157" text-anchor="middle" style="fill:var(--teal-ink)">a working copy</text>
<text class="sub" x="822" y="176" text-anchor="middle">your checkout, or a</text>
<text class="sub" x="822" y="193" text-anchor="middle">worktree of its own</text>
<path class="edge" d="M226,169 L730,169" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<rect class="node" x="270" y="224" width="184" height="58" rx="10" style="fill:var(--blue-fill);stroke:var(--blue)"/>
<text class="title" x="362" y="241" text-anchor="middle" style="fill:var(--blue-ink)">start_task</text>
<text class="sub" x="362" y="260" text-anchor="middle">lane mode shares the copy;</text>
<text class="sub" x="362" y="277" text-anchor="middle">parallel gets its own</text>
<path class="edge" d="M134,198 L134.0,245.0 Q134,253 142.0,253.0 L270,253" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<rect class="node" x="498" y="224" width="184" height="58" rx="10" style="fill:var(--green-fill);stroke:var(--green)"/>
<text class="title" x="590" y="241" text-anchor="middle" style="fill:var(--green-ink)">Peer</text>
<text class="sub" x="590" y="260" text-anchor="middle">does the task,</text>
<text class="sub" x="590" y="277" text-anchor="middle">then calls done</text>
<path class="edge" d="M454,244 L498,244" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M498,262 L454,262" style="stroke:var(--green)" marker-end="url(#a-green)"/>
<rect class="node" x="270" y="308" width="184" height="58" rx="10" style="fill:var(--blue-fill);stroke:var(--blue)"/>
<text class="title" x="362" y="325" text-anchor="middle" style="fill:var(--blue-ink)">start_review</text>
<text class="sub" x="362" y="344" text-anchor="middle">read-only, wherever</text>
<text class="sub" x="362" y="361" text-anchor="middle">the change is now</text>
<rect class="node" x="498" y="308" width="184" height="58" rx="10" style="fill:var(--green-fill);stroke:var(--green)"/>
<text class="title" x="590" y="325" text-anchor="middle" style="fill:var(--green-ink)">Reviewer</text>
<text class="sub" x="590" y="344" text-anchor="middle">reads with clean</text>
<text class="sub" x="590" y="361" text-anchor="middle">context, then done</text>
<path class="edge" d="M454,328 L498,328" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M498,346 L454,346" style="stroke:var(--green)" marker-end="url(#a-green)"/>
<rect class="node" x="270" y="392" width="184" height="58" rx="10" style="fill:var(--blue-fill);stroke:var(--blue)"/>
<text class="title" x="362" y="409" text-anchor="middle" style="fill:var(--blue-ink)">accept · rework · cut</text>
<text class="sub" x="362" y="428" text-anchor="middle">merged in place, or queued;</text>
<text class="sub" x="362" y="445" text-anchor="middle">rework wakes the same Peer</text>
<rect class="node" x="730" y="392" width="184" height="58" rx="10" style="fill:var(--teal-fill);stroke:var(--teal)"/>
<text class="title" x="822" y="409" text-anchor="middle" style="fill:var(--teal-ink)">merge queue</text>
<text class="sub" x="822" y="428" text-anchor="middle">parallel tasks, one at a</text>
<text class="sub" x="822" y="445" text-anchor="middle">time: merged, or rework</text>
<path class="edge" d="M454,421 L730,421" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<rect class="node" x="270" y="476" width="184" height="58" rx="10" style="fill:var(--blue-fill);stroke:var(--blue)"/>
<text class="title" x="362" y="493" text-anchor="middle" style="fill:var(--blue-ink)">report ready</text>
<text class="sub" x="362" y="512" text-anchor="middle">runs the lane gate, and</text>
<text class="sub" x="362" y="529" text-anchor="middle">reports to the Supervisor</text>
<rect class="node" x="730" y="476" width="184" height="58" rx="10" style="fill:var(--teal-fill);stroke:var(--teal)"/>
<text class="title" x="822" y="493" text-anchor="middle" style="fill:var(--teal-ink)">lane gate</text>
<text class="sub" x="822" y="512" text-anchor="middle">the project's own</text>
<text class="sub" x="822" y="529" text-anchor="middle">proof command</text>
<path class="edge" d="M454,505 L730,505" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M362,282 L362,308" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M362,366 L362,392" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M362,450 L362,476" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<rect class="node" x="42" y="560" width="184" height="58" rx="10" style="fill:var(--violet-fill);stroke:var(--violet)"/>
<text class="title" x="134" y="577" text-anchor="middle" style="fill:var(--violet-ink)">close_lane</text>
<text class="sub" x="134" y="596" text-anchor="middle">waits for queued merges,</text>
<text class="sub" x="134" y="613" text-anchor="middle">then lands the lane</text>
<path class="edge" d="M270,505 L142.0,505.0 Q134,505 134.0,513.0 L134,560" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<rect class="node" x="730" y="560" width="184" height="84" rx="10" style="fill:var(--teal-fill);stroke:var(--teal)"/>
<text class="title" x="822" y="581.5" text-anchor="middle" style="fill:var(--teal-ink)">landing</text>
<text class="sub" x="822" y="600.5" text-anchor="middle">1  merge the base into the lane</text>
<text class="sub" x="822" y="617.5" text-anchor="middle">2  run the gate on that</text>
<text class="sub" x="822" y="634.5" text-anchor="middle">3  fast-forward the base</text>
<path class="edge" d="M226,589 L730,589" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<rect class="node" x="730" y="666" width="184" height="58" rx="10" style="fill:var(--teal-fill);stroke:var(--teal)"/>
<text class="title" x="822" y="683" text-anchor="middle" style="fill:var(--teal-ink)">put away</text>
<text class="sub" x="822" y="702" text-anchor="middle">tasks cut, seats archived,</text>
<text class="sub" x="822" y="719" text-anchor="middle">the copy goes back</text>
<path class="edge" d="M822,644 L822,666" style="stroke:var(--teal)" marker-end="url(#a-teal)"/>
<rect class="node" x="498" y="666" width="184" height="58" rx="10" style="fill:var(--amber-fill);stroke:var(--amber)"/>
<text class="title" x="590" y="683" text-anchor="middle" style="fill:var(--amber-ink)">refused</text>
<text class="sub" x="590" y="702" text-anchor="middle">a seat mid-turn, a conflict,</text>
<text class="sub" x="590" y="719" text-anchor="middle">a red gate: the lane stays open</text>
<path class="edge dash" d="M730,630 L598.0,630.0 Q590,630 590.0,638.0 L590,666" style="stroke:var(--amber)" marker-end="url(#a-amber)"/>
<text class="note" x="40" y="700" text-anchor="start">A red gate can be overridden</text>
<text class="note" x="40" y="717" text-anchor="start">by the Supervisor with overGate;</text>
<text class="note" x="40" y="734" text-anchor="start">nothing else can.</text>
<circle cx="42" cy="140" r="11" style="fill:var(--violet)"/>
<text class="badge-text" x="42" y="144" text-anchor="middle">1</text>
<rect x="568.475" y="159" width="43.05" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="590" y="173" text-anchor="middle" style="fill:var(--violet-ink)">takes</text>
<circle cx="270" cy="224" r="11" style="fill:var(--blue)"/>
<text class="badge-text" x="270" y="228" text-anchor="middle">2</text>
<rect x="93.03999999999999" y="212" width="81.92000000000002" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="134" y="226" text-anchor="middle" style="fill:var(--violet-ink)">seats a Lead</text>
<rect x="455.97" y="222" width="40.06" height="20" rx="6" style="fill:var(--panel)"/>
<text class="pill-text" x="476" y="236" text-anchor="middle" style="fill:var(--blue-ink)">brief</text>
<rect x="457.58" y="266" width="36.84" height="20" rx="6" style="fill:var(--panel)"/>
<text class="pill-text" x="476" y="280" text-anchor="middle" style="fill:var(--green-ink)">done</text>
<circle cx="270" cy="308" r="11" style="fill:var(--blue)"/>
<text class="badge-text" x="270" y="312" text-anchor="middle">3</text>
<circle cx="270" cy="392" r="11" style="fill:var(--blue)"/>
<text class="badge-text" x="270" y="396" text-anchor="middle">4</text>
<rect x="563.645" y="411" width="52.71000000000001" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="590" y="425" text-anchor="middle" style="fill:var(--blue-ink)">parallel</text>
<circle cx="270" cy="476" r="11" style="fill:var(--blue)"/>
<text class="badge-text" x="270" y="480" text-anchor="middle">5</text>
<rect x="571.58" y="495" width="36.84" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="590" y="509" text-anchor="middle" style="fill:var(--blue-ink)">runs</text>
<circle cx="42" cy="560" r="11" style="fill:var(--violet)"/>
<text class="badge-text" x="42" y="564" text-anchor="middle">6</text>
<rect x="105.22999999999999" y="525" width="57.540000000000006" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="134" y="539" text-anchor="middle" style="fill:var(--blue-ink)">REPORT</text>
<rect x="573.075" y="579" width="33.85" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="590" y="593" text-anchor="middle" style="fill:var(--violet-ink)">land</text>
</svg>
