<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="How a seat is built: roles.json, the harness files, content, the settings layers and the catalogs feed three moments — plugin start writes sixteen Paseo providers, agent.create builds the seat directory and shapes the launch, and session_open points the agent at that directory.">
<title>How a seat is built: roles.json, the harness files, content, the settings layers and the catalogs feed three moments — plugin start writes sixteen Paseo providers, agent.create builds the seat directory and shapes the launch, and session_open points the agent at that directory.</title>
<defs><marker id="m57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="m8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="599" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328">From data to a running seat</text>
<text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636e">The same files answer three questions: what Paseo offers, what a seat is, and where it reads it.</text>
<rect x="32" y="92" width="236" height="420" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.2"/>
<text x="50" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Data</text>
<rect x="50" y="126" width="200" height="56" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/>
<text x="62" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">roles.json</text>
<text x="62" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">roles, prefix, attention</text>
<rect x="50" y="200" width="200" height="56" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/>
<text x="62" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">harness/&lt;agent&gt;/</text>
<text x="62" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">contract and settings</text>
<rect x="50" y="274" width="200" height="56" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/>
<text x="62" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">content/</text>
<text x="62" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">prompts, skills, guides</text>
<rect x="50" y="348" width="200" height="56" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/>
<text x="62" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">settings layers</text>
<text x="62" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">machine, then project</text>
<rect x="50" y="422" width="200" height="56" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/>
<text x="62" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">catalog/mcp · sensor</text>
<text x="62" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">optional servers, questions</text>
<text x="50" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">A field none of them knows fails the load.</text>
<rect x="330" y="108" width="280" height="66" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/>
<text x="470.0" y="127.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">plugin start</text>
<text x="470.0" y="146.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">one provider and profile per role and agent:</text>
<text x="470.0" y="164.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">sixteen of each in the shipped kit</text>
<rect x="330" y="240" width="280" height="84" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/>
<text x="470.0" y="268.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">before agent.create</text>
<text x="470.0" y="287.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">build &lt;profileRoot&gt;/sw2-&lt;role&gt;-&lt;agent&gt;-&lt;slug&gt;,</text>
<text x="470.0" y="305.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">then shape model, mode, prompt, MCP, sandbox</text>
<rect x="330" y="390" width="280" height="66" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.4"/>
<text x="470.0" y="409.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">before session_open</text>
<text x="470.0" y="428.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">point the agent's config directory at the seat,</text>
<text x="470.0" y="446.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">and set ROLE, PROJECT and STATE</text>
<rect x="660" y="92" width="268" height="420" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.2"/>
<text x="678" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">What lands</text>
<text x="678" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">~/.paseo/config.json</text>
<text x="678" y="159" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">  agents.providers, agentProfiles</text>
<line x1="678" y1="178" x2="910" y2="178" stroke="#d8dee4"/>
<text x="678" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">the seat directory</text>
<text x="678" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">  settings, MCP file, skills,</text>
<text x="678" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">  links to your logins,</text>
<text x="678" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">  the role prompt, the rules</text>
<line x1="678" y1="274" x2="910" y2="274" stroke="#d8dee4"/>
<text x="678" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">the launch config</text>
<text x="678" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">  model, thinking, mode,</text>
<text x="678" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">  servers, writable paths</text>
<line x1="678" y1="354" x2="910" y2="354" stroke="#d8dee4"/>
<text x="678" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Nothing is written unless the</text>
<text x="678" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">whole seat can be built. A seat</text>
<text x="678" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">that cannot be refuses the launch,</text>
<text x="678" y="429" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">with the reason.</text>
<text x="678" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">A rebuild happens when the settings</text>
<text x="678" y="481" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">revision changes, the directory is</text>
<text x="678" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">gone, or a login has appeared.</text>
<line x1="268" y1="200" x2="326" y2="150" stroke="#57606a" stroke-width="1.6" marker-end="url(#m57606a)"/>
<line x1="268" y1="290" x2="326" y2="280" stroke="#57606a" stroke-width="1.6" marker-end="url(#m57606a)"/>
<line x1="268" y1="400" x2="326" y2="415" stroke="#57606a" stroke-width="1.6" marker-end="url(#m57606a)"/>
<line x1="614" y1="140" x2="656" y2="140" stroke="#8250df" stroke-width="1.6" marker-end="url(#m8250df)"/>
<line x1="614" y1="280" x2="656" y2="240" stroke="#8250df" stroke-width="1.6" marker-end="url(#m8250df)"/>
<line x1="614" y1="420" x2="656" y2="320" stroke="#8250df" stroke-width="1.6" marker-end="url(#m8250df)"/>
<text x="480" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">Each moment reads the same data.</text>
<text x="480" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">None of it is code.</text>
<rect x="330" y="486" width="280" height="72" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.2"/>
<text x="348" y="512" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">seat-room checks the launch and execs</text>
<text x="348" y="529" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">the agent: Claude and Devin only.</text>
</svg>
