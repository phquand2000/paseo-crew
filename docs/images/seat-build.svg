<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="The kit&#x27;s data, roles.json, each harness&#x27;s settings and deltas, the tool sets, the catalog, the content and the settings layers, becomes a running seat in four steps: at plugin start a Paseo provider and profile per role and agent; before agent.create the seat directory and the launch; before agent.session_open the seat&#x27;s environment and PATH; and bin/seat-room, which checks the launch and starts Claude.">
<title>The kit's data, roles.json, each harness's settings and deltas, the tool sets, the catalog, the content and the settings layers, becomes a running seat in four steps: at plugin start a Paseo provider and profile per role and agent; before agent.create the seat directory and the launch; before agent.session_open the seat's environment and PATH; and bin/seat-room, which checks the launch and starts Claude.</title>
<style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--soft:#e6eaef;--ink:#1f2328;--muted:#59636e;--faint:#818b98;--shadow:rgba(31,35,40,0.10);--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26;}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--soft:#262c36;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--shadow:rgba(0,0,0,0);--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72;}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;white-space:pre}.canvas{fill:var(--bg);stroke:var(--line)}.h1{font-size:21px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.group{fill:var(--panel);stroke:var(--line)}.group-label{font-size:11px;font-weight:650;letter-spacing:0.08em;fill:var(--muted)}.node{stroke-width:1.4;filter:drop-shadow(0 1px 2px var(--shadow))}.title{font-size:14px;font-weight:620}.sub{font-size:12px;fill:var(--muted)}.note{font-size:12px;fill:var(--muted)}.strong{fill:var(--ink);font-weight:620}.edge{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}.pill-text{font-size:11.5px;font-weight:620}.chip{stroke-width:1}.chip-text{font-size:11px;font-weight:560}.badge-text{font-size:11px;font-weight:700;fill:var(--bg)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="559" rx="18"/>
<text class="h1" x="32" y="46">From data to a running seat</text>
<text class="lede" x="32" y="70">Every seat is built from data, in four steps, before its agent starts.</text>
<rect class="group" x="24" y="96" width="236" height="440" rx="14" style="fill:var(--slate-fill);fill-opacity:0.55;stroke:var(--slate);stroke-opacity:0.18"/>
<text class="group-label" x="40" y="120" style="fill:var(--slate-ink)">DATA, NOT CODE</text>
<rect class="node" x="40" y="134" width="204" height="52" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="142.0" y="155.5" text-anchor="middle" style="fill:var(--slate-ink)">roles.json</text>
<text class="sub" x="142.0" y="174.5" text-anchor="middle">roles, tool sets, defaults</text>
<rect class="node" x="40" y="200" width="204" height="52" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="142.0" y="221.5" text-anchor="middle" style="fill:var(--slate-ink)">harness/&lt;agent&gt;/</text>
<text class="sub" x="142.0" y="240.5" text-anchor="middle">settings, rules, deltas</text>
<rect class="node" x="40" y="266" width="204" height="52" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="142.0" y="287.5" text-anchor="middle" style="fill:var(--slate-ink)">mcp/tools.json</text>
<text class="sub" x="142.0" y="306.5" text-anchor="middle">the desk tools</text>
<rect class="node" x="40" y="332" width="204" height="52" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="142.0" y="353.5" text-anchor="middle" style="fill:var(--slate-ink)">catalog/</text>
<text class="sub" x="142.0" y="372.5" text-anchor="middle">MCP servers, ecosystem</text>
<rect class="node" x="40" y="398" width="204" height="52" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="142.0" y="419.5" text-anchor="middle" style="fill:var(--slate-ink)">content/</text>
<text class="sub" x="142.0" y="438.5" text-anchor="middle">prompts, skills, guides</text>
<rect class="node" x="40" y="464" width="204" height="52" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="142.0" y="485.5" text-anchor="middle" style="fill:var(--slate-ink)">settings layers</text>
<text class="sub" x="142.0" y="504.5" text-anchor="middle">machine, then project</text>
<rect class="group" x="276" y="96" width="408" height="440" rx="14" style="fill:var(--teal-fill);fill-opacity:0.55;stroke:var(--teal);stroke-opacity:0.18"/>
<text class="group-label" x="292" y="120" style="fill:var(--teal-ink)">THE PLUGIN, IN ORDER</text>
<rect class="node" x="300" y="138" width="360" height="62" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="480.0" y="156.0" text-anchor="middle" style="fill:var(--teal-ink)">plugin start</text>
<text class="sub" x="480.0" y="175.0" text-anchor="middle">a Paseo provider and profile</text>
<text class="sub" x="480.0" y="192.0" text-anchor="middle">per role and agent: thirty</text>
<circle cx="300" cy="138" r="11" style="fill:var(--teal)"/>
<text class="badge-text" x="300" y="142" text-anchor="middle">1</text>
<rect class="node" x="300" y="236" width="360" height="62" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="480.0" y="254.0" text-anchor="middle" style="fill:var(--teal-ink)">before agent.create</text>
<text class="sub" x="480.0" y="273.0" text-anchor="middle">builds the seat directory;</text>
<text class="sub" x="480.0" y="290.0" text-anchor="middle">model, mode, prompt, MCP</text>
<circle cx="300" cy="236" r="11" style="fill:var(--teal)"/>
<text class="badge-text" x="300" y="240" text-anchor="middle">2</text>
<rect class="node" x="300" y="334" width="360" height="62" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="480.0" y="352.0" text-anchor="middle" style="fill:var(--teal-ink)">before session_open</text>
<text class="sub" x="480.0" y="371.0" text-anchor="middle">config dir, SEATWORKS_ vars,</text>
<text class="sub" x="480.0" y="388.0" text-anchor="middle">its key; git, gh, paseo on PATH</text>
<circle cx="300" cy="334" r="11" style="fill:var(--teal)"/>
<text class="badge-text" x="300" y="338" text-anchor="middle">3</text>
<rect class="node" x="300" y="432" width="360" height="62" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="480.0" y="450.0" text-anchor="middle" style="fill:var(--teal-ink)">bin/seat-room</text>
<text class="sub" x="480.0" y="469.0" text-anchor="middle">checks the launch,</text>
<text class="sub" x="480.0" y="486.0" text-anchor="middle">then starts Claude</text>
<circle cx="300" cy="432" r="11" style="fill:var(--teal)"/>
<text class="badge-text" x="300" y="436" text-anchor="middle">4</text>
<rect class="group" x="700" y="96" width="236" height="440" rx="14" style="fill:var(--blue-fill);fill-opacity:0.55;stroke:var(--blue);stroke-opacity:0.18"/>
<text class="group-label" x="716" y="120" style="fill:var(--blue-ink)">WHAT LANDS</text>
<rect class="node" x="716" y="138" width="204" height="62" rx="10" style="fill:var(--blue-fill);stroke-opacity:0.55;stroke:var(--blue)"/>
<text class="title" x="818.0" y="164.5" text-anchor="middle" style="fill:var(--blue-ink)">~/.paseo/config.json</text>
<text class="sub" x="818.0" y="183.5" text-anchor="middle">providers, profiles</text>
<rect class="node" x="716" y="236" width="204" height="62" rx="10" style="fill:var(--blue-fill);stroke-opacity:0.55;stroke:var(--blue)"/>
<text class="title" x="818.0" y="262.5" text-anchor="middle" style="fill:var(--blue-ink)">the seat directory</text>
<text class="sub" x="818.0" y="281.5" text-anchor="middle">settings, MCP, skills, rules</text>
<rect class="node" x="716" y="334" width="204" height="62" rx="10" style="fill:var(--blue-fill);stroke-opacity:0.55;stroke:var(--blue)"/>
<text class="title" x="818.0" y="360.5" text-anchor="middle" style="fill:var(--blue-ink)">the seat's environment</text>
<text class="sub" x="818.0" y="379.5" text-anchor="middle">config dir, variables, key</text>
<rect class="node" x="716" y="432" width="204" height="62" rx="10" style="fill:var(--blue-fill);stroke-opacity:0.55;stroke:var(--blue)"/>
<text class="title" x="818.0" y="450.0" text-anchor="middle" style="fill:var(--blue-ink)">the seat's PATH</text>
<text class="sub" x="818.0" y="469.0" text-anchor="middle">a git that refuses what</text>
<text class="sub" x="818.0" y="486.0" text-anchor="middle">only the desk runs</text>
