<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-label="What the watch sees: a Lead's or Peer's timeline folds into a window. Code reads facts from it and from each lane's record. With a key, the turn is read into a trail and four views, each asked of Jev. Rules decide findings, Jev pinpoints the step, a sibling's note excuses it, and an incident goes to the lane's Supervisor, who marks it; calibrate reads the marks against what was kept.">
<title>What the watch sees: a Lead's or Peer's timeline folds into a window. Code reads facts from it and from each lane's record. With a key, the turn is read into a trail and four views, each asked of Jev. Rules decide findings, Jev pinpoints the step, a sibling's note excuses it, and an incident goes to the lane's Supervisor, who marks it; calibrate reads the marks against what was kept.</title>
<style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--soft:#e6eaef;--ink:#1f2328;--muted:#59636e;--faint:#818b98;--shadow:rgba(31,35,40,0.10);--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26;}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--soft:#262c36;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--shadow:rgba(0,0,0,0);--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72;}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;white-space:pre}.canvas{fill:var(--bg);stroke:var(--line)}.h1{font-size:21px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.group{fill:var(--panel);stroke:var(--line)}.group-label{font-size:11px;font-weight:650;letter-spacing:0.08em;fill:var(--muted)}.node{stroke-width:1.4;filter:drop-shadow(0 1px 2px var(--shadow))}.title{font-size:14px;font-weight:620}.sub{font-size:12px;fill:var(--muted)}.note{font-size:12px;fill:var(--muted)}.strong{fill:var(--ink);font-weight:620}.edge{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}.pill-text{font-size:11.5px;font-weight:620}.chip{stroke-width:1}.chip-text{font-size:11px;font-weight:560}.badge-text{font-size:11px;font-weight:700;fill:var(--bg)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="719" rx="18"/>
<text class="h1" x="32" y="46">What the watch sees</text>
<text class="lede" x="32" y="70">Code reads the facts, Jev reads the work, and the Supervisor decides. The seat it watches never hears of it.</text>
<rect class="node" x="24" y="110" width="172" height="58" rx="10" style="fill:var(--rose-fill);stroke:var(--rose)"/>
<text class="title" x="110" y="135.5" text-anchor="middle" style="fill:var(--rose-ink)">Lead or Peer</text>
<text class="sub" x="110" y="154.5" text-anchor="middle">never a Reviewer</text>
<rect class="node" x="24" y="200" width="172" height="58" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title" x="110" y="217" text-anchor="middle" style="fill:var(--slate-ink)">timeline</text>
<text class="sub" x="110" y="236" text-anchor="middle">live rows and paged</text>
<text class="sub" x="110" y="253" text-anchor="middle">history, joined</text>
<rect class="node" x="24" y="290" width="172" height="58" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title" x="110" y="307" text-anchor="middle" style="fill:var(--slate-ink)">window</text>
<text class="sub" x="110" y="326" text-anchor="middle">80 units per seat,</text>
<text class="sub" x="110" y="343" text-anchor="middle">keyed by call</text>
<path class="edge" d="M110,168 L110,200" style="stroke:var(--rose)" marker-end="url(#a-rose)"/>
<path class="edge" d="M110,258 L110,290" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<text class="note" x="26" y="392" text-anchor="start"><tspan class="strong">When Jev is asked</tspan></text>
<text class="note" x="26" y="409" text-anchor="start">5 s after the seat goes quiet,</text>
<text class="note" x="26" y="426" text-anchor="start">at least every 30 s while it</text>
<text class="note" x="26" y="443" text-anchor="start">works, and at once on a turn</text>
<text class="note" x="26" y="460" text-anchor="start">end, a failure, a page or a</text>
<text class="note" x="26" y="477" text-anchor="start">permission request.</text>
<rect class="group" x="214" y="100" width="480" height="204" rx="14" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.35"/>
<text class="group-label" x="230" y="124" style="fill:var(--teal-ink)">IN CODE, EVERY TURN</text>
<text class="sub" x="232" y="150" text-anchor="start">page</text>
