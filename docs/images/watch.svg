<text class="note" x="24" y="668" text-anchor="start"><tspan class="strong">The key is the switch: </tspan>no key, no watch at all. Mailing incidents is a second switch, off by default.</text>
<text class="note" x="24" y="685" text-anchor="start">A page is sent at once; an attend incident waits up to two minutes for Jev, and five a day at most.</text>
