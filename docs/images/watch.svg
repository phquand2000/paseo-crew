<text class="sub" x="835" y="154" text-anchor="middle">alone · agrees · confirms,</text>
<text class="sub" x="835" y="171" text-anchor="middle">and an unclear band</text>
<rect class="node" x="734" y="210" width="202" height="64" rx="10" style="fill:var(--rose-fill);stroke:var(--rose)"/>
<text class="title" x="835" y="230" text-anchor="middle" style="fill:var(--rose-ink)">pinpoint</text>
<text class="sub" x="835" y="249" text-anchor="middle">Jev picks the step:</text>
<text class="sub" x="835" y="266" text-anchor="middle">that is the quote</text>
<rect class="node" x="734" y="300" width="202" height="64" rx="10" style="fill:var(--rose-fill);stroke:var(--rose)"/>
<text class="title mono" x="835" y="320" text-anchor="middle" style="fill:var(--rose-ink)">excusedBeside</text>
<text class="sub" x="835" y="339" text-anchor="middle">a sibling's note on that</text>
<text class="sub" x="835" y="356" text-anchor="middle">step drops the finding</text>
