<rect class="group" x="214" y="322" width="480" height="150" rx="14" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.35"/>
<text class="group-label" x="230" y="346" style="fill:var(--rose-ink)">JEV, ONLY WITH A KEY</text>
<rect class="node" x="230" y="358" width="142" height="96" rx="10" style="fill:var(--rose-fill);stroke:var(--rose)"/>
<text class="title" x="301" y="385.5" text-anchor="middle" style="fill:var(--rose-ink)">trail</text>
<text class="sub" x="301" y="404.5" text-anchor="middle">S1…Sn in order:</text>
<text class="sub" x="301" y="421.5" text-anchor="middle">ran · changed · read</text>
<text class="sub" x="301" y="438.5" text-anchor="middle">called · said · thought</text>
<rect class="node" x="390" y="358" width="150" height="96" rx="10" style="fill:var(--rose-fill);stroke:var(--rose)"/>
<text class="title" x="465" y="385.5" text-anchor="middle" style="fill:var(--rose-ink)">four views</text>
<text class="sub" x="465" y="404.5" text-anchor="middle">actions · work</text>
<text class="sub" x="465" y="421.5" text-anchor="middle">claim · instruction</text>
<text class="sub" x="465" y="438.5" text-anchor="middle">each only its fields</text>
<rect class="node" x="558" y="358" width="120" height="96" rx="10" style="fill:var(--rose-fill);stroke:var(--rose)"/>
<text class="title" x="618" y="385.5" text-anchor="middle" style="fill:var(--rose-ink)">Jev</text>
<text class="sub" x="618" y="404.5" text-anchor="middle">one request per</text>
<text class="sub" x="618" y="421.5" text-anchor="middle">view, sent</text>
<text class="sub" x="618" y="438.5" text-anchor="middle">together</text>
