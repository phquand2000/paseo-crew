<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="SLP roles: the Human gives intent to the Supervisor; the Supervisor opens lanes for Leads; Leads start Peer tasks and reviews and accept the work; the desk watches Leads and Peers and raises incidents to the Supervisor; a Supervisor may message a Peer directly and the desk tells the Lead.">
<title>SLP roles: the Human gives intent to the Supervisor; the Supervisor opens lanes for Leads; Leads start Peer tasks and reviews and accept the work; the desk watches Leads and Peers and raises incidents to the Supervisor; a Supervisor may message a Peer directly and the desk tells the Lead.</title>
