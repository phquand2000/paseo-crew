<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-label="SLP: the Human owns intent; the Supervisor opens lanes and may intervene across them; each Lead owns sequencing and acceptance in its lane; each Peer owns the engineering inside its task; a Reviewer reads with clean context. The watch reads Leads and Peers and tells only the Supervisor.">
<title>SLP: the Human owns intent; the Supervisor opens lanes and may intervene across them; each Lead owns sequencing and acceptance in its lane; each Peer owns the engineering inside its task; a Reviewer reads with clean context. The watch reads Leads and Peers and tells only the Supervisor.</title>
<style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--soft:#e6eaef;--ink:#1f2328;--muted:#59636e;--faint:#818b98;--shadow:rgba(31,35,40,0.10);--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26;}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--soft:#262c36;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--shadow:rgba(0,0,0,0);--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72;}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;white-space:pre}.canvas{fill:var(--bg);stroke:var(--line)}.h1{font-size:21px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.group{fill:var(--panel);stroke:var(--line)}.group-label{font-size:11px;font-weight:650;letter-spacing:0.08em;fill:var(--muted)}.node{stroke-width:1.4;filter:drop-shadow(0 1px 2px var(--shadow))}.title{font-size:14px;font-weight:620}.sub{font-size:12px;fill:var(--muted)}.note{font-size:12px;fill:var(--muted)}.strong{fill:var(--ink);font-weight:620}.edge{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}.pill-text{font-size:11.5px;font-weight:620}.chip{stroke-width:1}.chip-text{font-size:11px;font-weight:560}.badge-text{font-size:11px;font-weight:700;fill:var(--bg)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="609" rx="18"/>
<text class="h1" x="32" y="46">SLP: who decides what</text>
<text class="lede" x="32" y="70">A graph of seats with different kinds of authority, not a chain of command.</text>
<rect class="group" x="24" y="100" width="290" height="470" rx="14"/>
<text class="group-label" x="40" y="124">AUTHORITY</text>
<circle cx="46" cy="149" r="6" style="fill:var(--slate-fill);stroke:var(--slate);stroke-width:2"/>
<text class="title" x="62" y="154" text-anchor="start" style="fill:var(--slate-ink)">Human</text>
<text class="note" x="62" y="173" text-anchor="start">intent, priorities,</text>
<text class="note" x="62" y="190" text-anchor="start">external commitments</text>
<circle cx="46" cy="217" r="6" style="fill:var(--violet-fill);stroke:var(--violet);stroke-width:2"/>
<text class="title" x="62" y="222" text-anchor="start" style="fill:var(--violet-ink)">Supervisor</text>
<text class="note" x="62" y="241" text-anchor="start">reads the intent, and may</text>
<text class="note" x="62" y="258" text-anchor="start">intervene across lanes</text>
<circle cx="46" cy="285" r="6" style="fill:var(--blue-fill);stroke:var(--blue);stroke-width:2"/>
<text class="title" x="62" y="290" text-anchor="start" style="fill:var(--blue-ink)">Lead</text>
<text class="note" x="62" y="309" text-anchor="start">sequencing and acceptance</text>
<text class="note" x="62" y="326" text-anchor="start">inside its own lane</text>
<circle cx="46" cy="353" r="6" style="fill:var(--green-fill);stroke:var(--green);stroke-width:2"/>
<text class="title" x="62" y="358" text-anchor="start" style="fill:var(--green-ink)">Peer</text>
<text class="note" x="62" y="377" text-anchor="start">engineering judgement</text>
<text class="note" x="62" y="394" text-anchor="start">inside its own task</text>
<circle cx="46" cy="421" r="6" style="fill:var(--green-fill);stroke:var(--green);stroke-width:2"/>
<text class="title" x="62" y="426" text-anchor="start" style="fill:var(--green-ink)">Reviewer</text>
<text class="note" x="62" y="445" text-anchor="start">a read-only Peer with</text>
<text class="note" x="62" y="462" text-anchor="start">clean context</text>
<line class="rule" x1="40" y1="494" x2="298" y2="494"/>
<text class="note" x="40" y="518" text-anchor="start"><tspan class="strong">The plugin decides none of these.</tspan></text>
<text class="note" x="40" y="535" text-anchor="start">It runs sessions, carries messages</text>
<text class="note" x="40" y="552" text-anchor="start">and keeps the durable record.</text>
<rect class="node" x="520" y="100" width="160" height="46" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title" x="600" y="128" text-anchor="middle" style="fill:var(--slate-ink)">Human</text>
<rect class="node" x="490" y="196" width="220" height="56" rx="10" style="fill:var(--violet-fill);stroke:var(--violet)"/>
<text class="title" x="600" y="220.5" text-anchor="middle" style="fill:var(--violet-ink)">Supervisor</text>
<text class="sub" x="600" y="239.5" text-anchor="middle">intent · lanes · incidents</text>
<rect class="node" x="495" y="335" width="220" height="56" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);opacity:0.75"/>
<rect class="node" x="490" y="330" width="220" height="56" rx="10" style="fill:var(--blue-fill);stroke:var(--blue)"/>
<text class="title" x="600" y="354.5" text-anchor="middle" style="fill:var(--blue-ink)">Lead</text>
<text class="sub" x="600" y="373.5" text-anchor="middle">one per lane</text>
<rect class="node" x="405" y="475" width="170" height="56" rx="10" style="fill:var(--green-fill);stroke:var(--green);opacity:0.75"/>
<rect class="node" x="400" y="470" width="170" height="56" rx="10" style="fill:var(--green-fill);stroke:var(--green)"/>
<text class="title" x="485" y="494.5" text-anchor="middle" style="fill:var(--green-ink)">Peer</text>
<text class="sub" x="485" y="513.5" text-anchor="middle">one per task</text>
<rect class="node" x="626" y="470" width="170" height="56" rx="10" style="fill:var(--green-fill);stroke:var(--green)"/>
<text class="title" x="711" y="494.5" text-anchor="middle" style="fill:var(--green-ink)">Reviewer</text>
<text class="sub" x="711" y="513.5" text-anchor="middle">reads, never writes</text>
<rect class="node" x="800" y="330" width="136" height="56" rx="10" style="fill:var(--rose-fill);stroke:var(--rose)"/>
<text class="title" x="868" y="354.5" text-anchor="middle" style="fill:var(--rose-ink)">The watch</text>
<text class="sub" x="868" y="373.5" text-anchor="middle">the desk, not a seat</text>
<path class="edge" d="M600,146 L600,196" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<path class="edge" d="M565,252 L565,330" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<path class="edge" d="M640,330 L640,252" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M525,391 L525,470" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M445,470 L445.0,366.0 Q445,358 453.0,358.0 L490,358" style="stroke:var(--green)" marker-end="url(#a-green)"/>
<path class="edge" d="M690,391 L690,470" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge dash" d="M490,224 L378.0,224.0 Q370,224 370.0,232.0 L370.0,490.0 Q370,498 378.0,498.0 L400,498" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<path class="edge" d="M715,358 L800,358" style="stroke:var(--rose)" marker-end="url(#a-rose)"/>
<path class="edge" d="M485,531 L485.0,548.0 Q485,556 493.0,556.0 L860.0,556.0 Q868,556 868.0,548.0 L868,386" style="stroke:var(--rose)" marker-end="url(#a-rose)"/>
<path class="edge" d="M868,330 L868.0,232.0 Q868,224 860.0,224.0 L710,224" style="stroke:var(--rose)" marker-end="url(#a-rose)"/>
<text class="note" x="936" y="590" text-anchor="end">The watch only reads. Nothing it concludes goes back to the seat it watched.</text>
<rect x="554.44" y="161" width="91.12" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="600" y="175" text-anchor="middle" style="fill:var(--slate-ink)">what it wants</text>
<rect x="532.55" y="270" width="64.9" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="565" y="284" text-anchor="middle" style="fill:var(--violet-ink)">open_lane</text>
<rect x="601.225" y="294" width="77.55000000000001" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="640" y="308" text-anchor="middle" style="fill:var(--blue-ink)">report · ask</text>
<rect x="487.95" y="420" width="74.1" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="525" y="434" text-anchor="middle" style="fill:var(--blue-ink)">start_task</text>
<rect x="412.435" y="415" width="65.13000000000001" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="445" y="429" text-anchor="middle" style="fill:var(--green-ink)">done · ask</text>
<rect x="646.395" y="420" width="87.21000000000001" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="690" y="434" text-anchor="middle" style="fill:var(--blue-ink)">start_review</text>
<rect x="321.105" y="312.5" width="97.79" height="35" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="370" y="326.5" text-anchor="middle" style="fill:var(--violet-ink)">message, and</text>
<text class="pill-text" x="370" y="341.5" text-anchor="middle" style="fill:var(--violet-ink)">the Lead is told</text>
<rect x="846.475" y="460" width="43.05" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="868" y="474" text-anchor="middle" style="fill:var(--rose-ink)">turns</text>
<rect x="840.15" y="267" width="55.7" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="868" y="281" text-anchor="middle" style="fill:var(--rose-ink)">incident</text>
</svg>
