<line x1="50" y1="454" x2="286" y2="454" stroke="#d8dee4"/>
<text x="50" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328" text-anchor="start">The plugin decides none of these.</text>
<text x="50" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">It runs sessions, carries messages,</text>
