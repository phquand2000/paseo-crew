<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-label="The Human holds intent, priorities and external commitments; the Supervisor settles the work with them and is the only seat that asks them; a Lead owns sequencing and acceptance in its lane; a Peer owns the engineering judgement in its task; a Reviewer reads one change; the Watcher answers the watch&#x27;s questions and the Pager pages the Human. The Supervisor opens and holds lanes and hears reports and asks; the Lead gives tasks and reviews; the Supervisor may message a Peer, and its Lead is told first. The plugin decides none of this.">
<title>The Human holds intent, priorities and external commitments; the Supervisor settles the work with them and is the only seat that asks them; a Lead owns sequencing and acceptance in its lane; a Peer owns the engineering judgement in its task; a Reviewer reads one change; the Watcher answers the watch's questions and the Pager pages the Human. The Supervisor opens and holds lanes and hears reports and asks; the Lead gives tasks and reviews; the Supervisor may message a Peer, and its Lead is told first. The plugin decides none of this.</title>
<style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--soft:#e6eaef;--ink:#1f2328;--muted:#59636e;--faint:#818b98;--shadow:rgba(31,35,40,0.10);--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26;}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--soft:#262c36;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--shadow:rgba(0,0,0,0);--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72;}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;white-space:pre}.canvas{fill:var(--bg);stroke:var(--line)}.h1{font-size:21px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.group{fill:var(--panel);stroke:var(--line)}.group-label{font-size:11px;font-weight:650;letter-spacing:0.08em;fill:var(--muted)}.node{stroke-width:1.4;filter:drop-shadow(0 1px 2px var(--shadow))}.title{font-size:14px;font-weight:620}.sub{font-size:12px;fill:var(--muted)}.note{font-size:12px;fill:var(--muted)}.strong{fill:var(--ink);font-weight:620}.edge{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}.pill-text{font-size:11.5px;font-weight:620}.chip{stroke-width:1}.chip-text{font-size:11px;font-weight:560}.badge-text{font-size:11px;font-weight:700;fill:var(--bg)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="699" rx="18"/>
<text class="h1" x="32" y="46">SLP: who decides what</text>
<text class="lede" x="32" y="70">A graph of seats with different kinds of authority, not a chain of command.</text>
<rect class="group" x="24" y="96" width="290" height="574" rx="14"/>
<text class="group-label" x="40" y="120">AUTHORITY</text>
<circle cx="46" cy="146" r="6" style="fill:var(--slate-fill);stroke:var(--slate);stroke-width:2"/>
<text class="title" x="62" y="151" text-anchor="start" style="fill:var(--slate-ink)">Human</text>
<text class="note" x="62" y="170" text-anchor="start">intent, priorities,</text>
<text class="note" x="62" y="187" text-anchor="start">external commitments</text>
<circle cx="46" cy="208" r="6" style="fill:var(--violet-fill);stroke:var(--violet);stroke-width:2"/>
<text class="title" x="62" y="213" text-anchor="start" style="fill:var(--violet-ink)">Supervisor</text>
<text class="note" x="62" y="232" text-anchor="start">settles the work with you;</text>
<text class="note" x="62" y="249" text-anchor="start">the only one that asks you</text>
<circle cx="46" cy="270" r="6" style="fill:var(--blue-fill);stroke:var(--blue);stroke-width:2"/>
<text class="title" x="62" y="275" text-anchor="start" style="fill:var(--blue-ink)">Lead</text>
<text class="note" x="62" y="294" text-anchor="start">sequencing and acceptance</text>
<text class="note" x="62" y="311" text-anchor="start">inside its own lane</text>
<circle cx="46" cy="332" r="6" style="fill:var(--green-fill);stroke:var(--green);stroke-width:2"/>
<text class="title" x="62" y="337" text-anchor="start" style="fill:var(--green-ink)">Peer</text>
<text class="note" x="62" y="356" text-anchor="start">engineering judgement</text>
<text class="note" x="62" y="373" text-anchor="start">inside its own task</text>
<circle cx="46" cy="394" r="6" style="fill:var(--green-fill);stroke:var(--green);stroke-width:2"/>
<text class="title" x="62" y="399" text-anchor="start" style="fill:var(--green-ink)">Reviewer</text>
<text class="note" x="62" y="418" text-anchor="start">a read-only reading</text>
<text class="note" x="62" y="435" text-anchor="start">of one change</text>
<circle cx="46" cy="456" r="6" style="fill:var(--teal-fill);stroke:var(--teal);stroke-width:2"/>
<text class="title" x="62" y="461" text-anchor="start" style="fill:var(--teal-ink)">Watcher</text>
<text class="note" x="62" y="480" text-anchor="start">a second opinion on what the</text>
<text class="note" x="62" y="497" text-anchor="start">watch flags; only logged</text>
<circle cx="46" cy="518" r="6" style="fill:var(--rose-fill);stroke:var(--rose);stroke-width:2"/>
<text class="title" x="62" y="523" text-anchor="start" style="fill:var(--rose-ink)">Pager</text>
<text class="note" x="62" y="542" text-anchor="start">carries an urgent alert</text>
<text class="note" x="62" y="559" text-anchor="start">to your phone</text>
<line class="rule" x1="40" y1="594" x2="298" y2="594"/>
<text class="note" x="40" y="618" text-anchor="start"><tspan class="strong">The plugin decides none of these.</tspan></text>
<text class="note" x="40" y="635" text-anchor="start">It runs sessions, carries messages</text>
<text class="note" x="40" y="652" text-anchor="start">and keeps the durable record.</text>
<rect class="node" x="520" y="100" width="160" height="46" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="600.0" y="127.0" text-anchor="middle" style="fill:var(--slate-ink)">Human</text>
<rect class="node" x="490" y="196" width="220" height="58" rx="10" style="fill:var(--violet-fill);stroke-opacity:0.55;stroke:var(--violet)"/>
<text class="title" x="600.0" y="220.5" text-anchor="middle" style="fill:var(--violet-ink)">Supervisor</text>
<text class="sub" x="600.0" y="239.5" text-anchor="middle">writes CONTEXT.md · lanes</text>
<rect x="498" y="352" width="220" height="58" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.35"/>
<rect x="494" y="348" width="220" height="58" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);stroke-opacity:0.35"/>
<rect class="node" x="490" y="344" width="220" height="58" rx="10" style="fill:var(--blue-fill);stroke-opacity:0.55;stroke:var(--blue)"/>
<text class="title" x="600.0" y="368.5" text-anchor="middle" style="fill:var(--blue-ink)">Lead</text>
<text class="sub" x="600.0" y="387.5" text-anchor="middle">one per lane, many at once</text>
<rect x="408" y="508" width="170" height="58" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.35"/>
<rect x="404" y="504" width="170" height="58" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.35"/>
<rect class="node" x="400" y="500" width="170" height="58" rx="10" style="fill:var(--green-fill);stroke-opacity:0.55;stroke:var(--green)"/>
<text class="title" x="485.0" y="524.5" text-anchor="middle" style="fill:var(--green-ink)">Peer</text>
<text class="sub" x="485.0" y="543.5" text-anchor="middle">one per task</text>
<rect x="634" y="508" width="170" height="58" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.35"/>
<rect x="630" y="504" width="170" height="58" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.35"/>
<rect class="node" x="626" y="500" width="170" height="58" rx="10" style="fill:var(--green-fill);stroke-opacity:0.55;stroke:var(--green)"/>
<text class="title" x="711.0" y="524.5" text-anchor="middle" style="fill:var(--green-ink)">Reviewer</text>
<text class="sub" x="711.0" y="543.5" text-anchor="middle">one per review</text>
<rect x="778" y="104" width="160" height="58" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.35"/>
<rect x="774" y="100" width="160" height="58" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.35"/>
<rect class="node" x="770" y="96" width="160" height="58" rx="10" style="fill:var(--rose-fill);stroke-opacity:0.55;stroke:var(--rose)"/>
<text class="title" x="850.0" y="120.5" text-anchor="middle" style="fill:var(--rose-ink)">Pager</text>
<text class="sub" x="850.0" y="139.5" text-anchor="middle">one per page</text>
<rect class="node" x="770" y="196" width="160" height="58" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="850.0" y="212.0" text-anchor="middle" style="fill:var(--teal-ink)">Watcher</text>
<text class="sub" x="850.0" y="231.0" text-anchor="middle">one per project;</text>
<text class="sub" x="850.0" y="248.0" text-anchor="middle">touches no work</text>
<text class="sub" x="382" y="292" text-anchor="start" style="fill:var(--violet-ink)">message;</text>
<text class="sub" x="382" y="309" text-anchor="start" style="fill:var(--violet-ink)">its Lead is</text>
<text class="sub" x="382" y="326" text-anchor="start" style="fill:var(--violet-ink)">told first</text>
<path class="edge" d="M600,146 L600,196" style="stroke-opacity:0.75;stroke:var(--slate)" marker-start="url(#a-slate)" marker-end="url(#a-slate)"/>
<path class="edge" d="M560,254 L560,344" style="stroke-opacity:0.75;stroke:var(--violet)" marker-end="url(#a-violet)"/>
<path class="edge" d="M650,344 L650,254" style="stroke-opacity:0.75;stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M525,410 L525,500" style="stroke-opacity:0.75;stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M430,500 L430.0,381.0 Q430,373 438.0,373.0 L490,373" style="stroke-opacity:0.75;stroke:var(--green)" marker-end="url(#a-green)"/>
<path class="edge" d="M690,410 L690,500" style="stroke-opacity:0.75;stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M770,123 L680,123" style="stroke-opacity:0.75;stroke:var(--rose)" marker-end="url(#a-rose)"/>
<path class="edge dash" d="M490,225 L380.0,225.0 Q372,225 372.0,233.0 L372.0,521.0 Q372,529 380.0,529.0 L400,529" style="stroke-opacity:0.75;stroke:var(--violet)" marker-end="url(#a-violet)"/>
<rect x="531.0" y="161" width="138.1" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="600" y="175" text-anchor="middle" style="fill:var(--slate-ink)">questions · your queue</text>
<rect x="492.8" y="275" width="134.4" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="560" y="289" text-anchor="middle" style="fill:var(--violet-ink)">open_lane · hold_lane</text>
<rect x="612.1" y="305" width="75.8" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="650" y="319" text-anchor="middle" style="fill:var(--blue-ink)">report · ask</text>
<rect x="465.6" y="448" width="118.7" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="525" y="462" text-anchor="middle" style="fill:var(--blue-ink)">add_tasks · rework</text>
<rect x="394.3" y="416" width="71.4" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="430" y="430" text-anchor="middle" style="fill:var(--green-ink)">done · ask</text>
<rect x="650.2" y="442" width="79.6" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="690" y="456" text-anchor="middle" style="fill:var(--blue-ink)">start_review</text>
<rect x="700.9" y="113" width="48.2" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="725" y="127" text-anchor="middle" style="fill:var(--rose-ink)">a page</text>
</svg>
