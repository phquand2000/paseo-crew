<rect x="0.5" y="0.5" width="959" height="579" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328">SLP: who decides what</text>
<text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636e">A graph of seats with different kinds of authority, not a chain of command.</text>
