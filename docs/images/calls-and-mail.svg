<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-label="Tool calls in, letters out: a seat's desk call goes through team.mjs into a spool file; the daemon checks its arguments against the tool's schema, runs the verb, and writes a reply file. Letters wait in one outbox and are pumped into a seat: steered into a running turn, held, or sent.">
<title>Tool calls in, letters out: a seat's desk call goes through team.mjs into a spool file; the daemon checks its arguments against the tool's schema, runs the verb, and writes a reply file. Letters wait in one outbox and are pumped into a seat: steered into a running turn, held, or sent.</title>
<style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--soft:#e6eaef;--ink:#1f2328;--muted:#59636e;--faint:#818b98;--shadow:rgba(31,35,40,0.10);--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26;}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--soft:#262c36;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--shadow:rgba(0,0,0,0);--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72;}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;white-space:pre}.canvas{fill:var(--bg);stroke:var(--line)}.h1{font-size:21px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.group{fill:var(--panel);stroke:var(--line)}.group-label{font-size:11px;font-weight:650;letter-spacing:0.08em;fill:var(--muted)}.node{stroke-width:1.4;filter:drop-shadow(0 1px 2px var(--shadow))}.title{font-size:14px;font-weight:620}.sub{font-size:12px;fill:var(--muted)}.note{font-size:12px;fill:var(--muted)}.strong{fill:var(--ink);font-weight:620}.edge{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}.pill-text{font-size:11.5px;font-weight:620}.chip{stroke-width:1}.chip-text{font-size:11px;font-weight:560}.badge-text{font-size:11px;font-weight:700;fill:var(--bg)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="609" rx="18"/>
<text class="h1" x="32" y="46">Tool calls in, letters out</text>
<text class="lede" x="32" y="70">Two one-way paths: files into the daemon, messages back through Paseo.</text>
<rect class="group" x="24" y="100" width="912" height="272" rx="14"/>
<text class="group-label" x="40" y="124">TOOL CALLS IN</text>
<rect class="node" x="44" y="140" width="136" height="60" rx="10" style="fill:var(--green-fill);stroke:var(--green)"/>
<text class="title" x="112" y="166.5" text-anchor="middle" style="fill:var(--green-ink)">the agent</text>
<text class="sub" x="112" y="185.5" text-anchor="middle">calls a desk tool</text>
<rect class="node" x="206" y="140" width="164" height="60" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title mono" x="288" y="158" text-anchor="middle" style="fill:var(--slate-ink)">team.mjs</text>
<text class="sub" x="288" y="177" text-anchor="middle">the role's tool set,</text>
<text class="sub" x="288" y="194" text-anchor="middle">over stdio</text>
<rect class="node" x="396" y="140" width="200" height="60" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title mono" x="496" y="166.5" text-anchor="middle" style="fill:var(--slate-ink)">requests/&lt;id&gt;.json</text>
<text class="sub" x="496" y="185.5" text-anchor="middle">a temp file, then a rename</text>
<rect class="node" x="622" y="140" width="150" height="60" rx="10" style="fill:var(--teal-fill);stroke:var(--teal)"/>
<text class="title" x="697" y="158" text-anchor="middle" style="fill:var(--teal-ink)">fits the schema?</text>
<text class="sub" x="697" y="177" text-anchor="middle">desk/args.ts, against</text>
<text class="sub" x="697" y="194" text-anchor="middle">tools.json</text>
<rect class="node" x="798" y="140" width="118" height="60" rx="10" style="fill:var(--teal-fill);stroke:var(--teal)"/>
<text class="title" x="857" y="158" text-anchor="middle" style="fill:var(--teal-ink)">the verb</text>
<text class="sub" x="857" y="177" text-anchor="middle">one lock per</text>
<text class="sub" x="857" y="194" text-anchor="middle">project</text>
<path class="edge" d="M180,170 L206,170" style="stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M370,170 L396,170" style="stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M596,170 L622,170" style="stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M772,170 L798,170" style="stroke:var(--teal)" marker-end="url(#a-teal)"/>
<rect class="node" x="396" y="246" width="200" height="60" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title mono" x="496" y="272.5" text-anchor="middle" style="fill:var(--slate-ink)">replies/&lt;id&gt;.json</text>
<text class="sub" x="496" y="291.5" text-anchor="middle">polled every 250 ms</text>
<path class="edge" d="M697,200 L697.0,258.0 Q697,266 689.0,266.0 L596,266" style="stroke:var(--red)" marker-end="url(#a-red)"/>
<path class="edge" d="M857,200 L857.0,282.0 Q857,290 849.0,290.0 L596,290" style="stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M396,276 L296.0,276.0 Q288,276 288.0,268.0 L288,200" style="stroke:var(--teal)" marker-end="url(#a-teal)"/>
<text class="note" x="44" y="336" text-anchor="start">team.mjs waits up to 300 s, then</text>
<text class="note" x="44" y="353" text-anchor="start">tells the seat the desk is not running.</text>
<text class="note" x="396" y="336" text-anchor="start">Drained every 500 ms. Anything ten</text>
<text class="note" x="396" y="353" text-anchor="start">minutes old is dropped.</text>
<text class="note" x="622" y="336" text-anchor="start">Still running at 240 s: the answer comes</text>
<text class="note" x="622" y="353" text-anchor="start">as mail. The same call twice joins the first.</text>
<rect class="group" x="24" y="396" width="912" height="190" rx="14"/>
<text class="group-label" x="40" y="420">LETTERS OUT</text>
<rect class="node" x="44" y="440" width="160" height="60" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title" x="124" y="458" text-anchor="middle" style="fill:var(--slate-ink)">desk · patrol</text>
<text class="sub" x="124" y="477" text-anchor="middle">letters for a seat,</text>
<text class="sub" x="124" y="494" text-anchor="middle">from any project</text>
<rect class="node" x="230" y="440" width="196" height="60" rx="10" style="fill:var(--amber-fill);stroke:var(--amber)"/>
<text class="title mono" x="328" y="458" text-anchor="middle" style="fill:var(--amber-ink)">outbox.json</text>
<text class="sub" x="328" y="477" text-anchor="middle">one file; a repeat within</text>
<text class="sub" x="328" y="494" text-anchor="middle">30 minutes is dropped</text>
<rect class="node" x="452" y="440" width="186" height="60" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title" x="545" y="458" text-anchor="middle" style="fill:var(--slate-ink)">pump</text>
<text class="sub" x="545" y="477" text-anchor="middle">a new letter, a turn end,</text>
<text class="sub" x="545" y="494" text-anchor="middle">or a patrol round</text>
<path class="edge" d="M204,470 L230,470" style="stroke:var(--amber)" marker-end="url(#a-amber)"/>
<path class="edge" d="M426,470 L452,470" style="stroke:var(--amber)" marker-end="url(#a-amber)"/>
<rect class="node" x="700" y="420" width="216" height="40" rx="10" style="fill:var(--blue-fill);stroke:var(--blue)"/>
<text class="sub" x="716" y="445" text-anchor="start"><tspan class="strong">steered  </tspan>into the running turn</text>
<rect class="node" x="700" y="470" width="216" height="40" rx="10" style="fill:var(--amber-fill);stroke:var(--amber)"/>
<text class="sub" x="716" y="495" text-anchor="start"><tspan class="strong">held  </tspan>until the seat can take it</text>
<rect class="node" x="700" y="520" width="216" height="40" rx="10" style="fill:var(--green-fill);stroke:var(--green)"/>
<text class="sub" x="716" y="545" text-anchor="start"><tspan class="strong">sent  </tspan>as one message, asks below</text>
<path class="edge" d="M638,470 L660.0,470.0 Q668,470 668.0,462.0 L668.0,448.0 Q668,440 676.0,440.0 L700,440" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M638,470 L660.0,470.0 Q668,470 668.0,478.0 L668.0,482.0 Q668,490 676.0,490.0 L700,490" style="stroke:var(--amber)" marker-end="url(#a-amber)"/>
<path class="edge" d="M638,470 L660.0,470.0 Q668,470 668.0,478.0 L668.0,532.0 Q668,540 676.0,540.0 L700,540" style="stroke:var(--green)" marker-end="url(#a-green)"/>
<text class="note" x="44" y="532" text-anchor="start">Steered only where the agent can take it and the turn has run 60 s.</text>
<text class="note" x="44" y="549" text-anchor="start">Held while the seat waits on a permission, is busy, or had mail in</text>
<text class="note" x="44" y="566" text-anchor="start">the last 10 minutes. A letter nobody took in 7 days is dropped.</text>
<rect x="669.265" y="216" width="55.470000000000006" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="697" y="230" text-anchor="middle" style="fill:var(--red-ink)">refused</text>
<rect x="830.53" y="234" width="52.94" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="857" y="248" text-anchor="middle" style="fill:var(--teal-ink)">answer</text>
</svg>
