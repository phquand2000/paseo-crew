<text x="673.0" y="362.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">Busy in a turn?</text>
<text x="673.0" y="382.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">hold (or steer ↓)</text>
<rect x="764.0" y="330.0" width="150.0" height="72.0" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
<text x="839.0" y="362.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2328" text-anchor="middle">Mailed &lt; 10 min ago?</text>
<text x="839.0" y="382.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">hold till turn end / 10 min</text>
