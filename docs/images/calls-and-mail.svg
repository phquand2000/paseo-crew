<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Tool calls: a seat's team.mjs MCP server writes a request into the spool, the desk answers it into a reply file. Letters: the desk posts to outbox.json and pumps each seat, holding mail while it waits on a permission, is busy, or was just written to, and steering into a running turn where the agent allows.">
<title>Tool calls: a seat's team.mjs MCP server writes a request into the spool, the desk answers it into a reply file. Letters: the desk posts to outbox.json and pumps each seat, holding mail while it waits on a permission, is busy, or was just written to, and steering into a running turn where the agent allows.</title>
<defs><marker id="m57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="m0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="599" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<text x="32.0" y="44.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="start">Tool calls in, letters out</text>
<text x="32.0" y="68.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">Seats reach the desk through a file spool. The desk reaches seats through a durable outbox.</text>
<text x="32.0" y="112.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">A seat calls a desk tool</text>
