<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="Tool calls and letters: a seat's team server writes a request into the spool and the desk answers it into a reply file; the desk posts letters into one outbox and pumps each seat, holding mail while it waits on a permission, is busy or was just written to, and steering into a running turn where the agent allows.">
<title>Tool calls and letters: a seat's team server writes a request into the spool and the desk answers it into a reply file; the desk posts letters into one outbox and pumps each seat, holding mail while it waits on a permission, is busy or was just written to, and steering into a running turn where the agent allows.</title>
<defs><marker id="m0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="m0f6e6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f6e6e"/></marker><marker id="m1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="m57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="m9a6700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="579" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328">Tool calls in, letters out</text>
<text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#59636e">Two one-way paths: files into the daemon, messages back through Paseo.</text>
<rect x="32" y="92" width="260" height="240" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.2"/>
<text x="50" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">A seat</text>
<rect x="50" y="134" width="224" height="56" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.4"/>
<text x="162.0" y="158.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">the agent</text>
<text x="162.0" y="177.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">calls a desk tool</text>
<rect x="50" y="214" width="224" height="56" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
<text x="162.0" y="238.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">team.mjs</text>
<text x="162.0" y="257.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">the tool set, over stdio</text>
<text x="50" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">It waits 300 s, then says the</text>
<text x="50" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">desk is probably not running.</text>
<rect x="350" y="92" width="260" height="240" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.2"/>
<text x="368" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">The spool</text>
<text x="368" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">spool/requests/&lt;id&gt;.json</text>
<text x="368" y="161" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">spool/replies/&lt;id&gt;.json</text>
<text x="368" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Written through a temporary file</text>
<text x="368" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">and a rename, so a half-written</text>
<text x="368" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">call is never read.</text>
<line x1="368" y1="256" x2="592" y2="256" stroke="#d8dee4"/>
<text x="368" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Drained every 500 ms.</text>
<text x="368" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Anything ten minutes old is</text>
<text x="368" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">dropped, request or reply.</text>
<rect x="668" y="92" width="260" height="240" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.2"/>
<text x="686" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">The desk</text>
<rect x="686" y="134" width="224" height="56" rx="10" fill="#e0f5f5" stroke="#0f6e6e" stroke-width="1.4"/>
<text x="798.0" y="158.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">the verb</text>
<text x="798.0" y="177.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">one lock per project</text>
<text x="686" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Still running at 240 s: the seat is</text>
<text x="686" y="229" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">told to end its turn, and the answer</text>
<text x="686" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">follows as a letter.</text>
<text x="686" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">The same call twice joins the first,</text>
<text x="686" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">so no gate runs twice.</text>
<line x1="162" y1="190" x2="162" y2="208" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#m1a7f37)"/>
<line x1="276" y1="224" x2="346" y2="160" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#m1a7f37)"/>
<text x="300" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1a7f37" text-anchor="start">request</text>
<line x1="612" y1="160" x2="664" y2="160" stroke="#0f6e6e" stroke-width="1.6" marker-end="url(#m0f6e6e)"/>
<line x1="664" y1="198" x2="612" y2="258" stroke="#0f6e6e" stroke-width="1.6" marker-end="url(#m0f6e6e)"/>
<text x="646" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f6e6e" text-anchor="start">reply</text>
<line x1="346" y1="272" x2="276" y2="250" stroke="#57606a" stroke-width="1.6" marker-end="url(#m57606a)"/>
<rect x="32" y="368" width="896" height="200" rx="12" fill="#f6f8fa" stroke="#d8dee4" stroke-width="1.2"/>
<text x="50" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Letters</text>
<rect x="52" y="410" width="200" height="56" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
<text x="152.0" y="434.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">one outbox</text>
<text x="152.0" y="453.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">every project, one file</text>
<rect x="292" y="410" width="200" height="56" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
<text x="392.0" y="424.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">pump</text>
<text x="392.0" y="443.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">on a new letter, a turn</text>
<text x="392.0" y="461.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">ending, a patrol round</text>
<rect x="556" y="386" width="176" height="52" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
<text x="644.0" y="408.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">steered</text>
<text x="644.0" y="427.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">into a running turn</text>
<rect x="556" y="452" width="176" height="52" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.4"/>
<text x="644.0" y="474.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">held</text>
<text x="644.0" y="493.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">or sent, or aged out</text>
<line x1="252" y1="438" x2="288" y2="438" stroke="#57606a" stroke-width="1.6" marker-end="url(#m57606a)"/>
<line x1="492" y1="428" x2="552" y2="412" stroke="#0969da" stroke-width="1.6" marker-end="url(#m0969da)"/>
<line x1="492" y1="450" x2="552" y2="478" stroke="#9a6700" stroke-width="1.6" marker-end="url(#m9a6700)"/>
<text x="52" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">Steered only where the agent allows it and the turn has run a minute; held while the seat waits on a</text>
<text x="52" y="541" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">permission, is busy, or was written to in the last ten minutes. One pump sends everything waiting as one</text>
<text x="52" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">message, with the seat's open asks underneath. A letter nobody took in seven days is dropped.</text>
</svg>
