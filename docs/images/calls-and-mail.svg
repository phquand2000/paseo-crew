<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="A seat&#x27;s tool call goes through its team.mjs and one line to desk.sock; the desk checks the arguments against tools.json, runs the verb as one transaction and answers on the same line, or by mail past 240 s. Every letter goes into outbox.json, and the pump, on a new letter, a turn end or a patrol round, steers it into a running turn, holds it, keeps it until a letter asks something, or sends it all at once.">
<title>A seat's tool call goes through its team.mjs and one line to desk.sock; the desk checks the arguments against tools.json, runs the verb as one transaction and answers on the same line, or by mail past 240 s. Every letter goes into outbox.json, and the pump, on a new letter, a turn end or a patrol round, steers it into a running turn, holds it, keeps it until a letter asks something, or sends it all at once.</title>
<style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--soft:#e6eaef;--ink:#1f2328;--muted:#59636e;--faint:#818b98;--shadow:rgba(31,35,40,0.10);--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26;}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--soft:#262c36;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--shadow:rgba(0,0,0,0);--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72;}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;white-space:pre}.canvas{fill:var(--bg);stroke:var(--line)}.h1{font-size:21px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.group{fill:var(--panel);stroke:var(--line)}.group-label{font-size:11px;font-weight:650;letter-spacing:0.08em;fill:var(--muted)}.node{stroke-width:1.4;filter:drop-shadow(0 1px 2px var(--shadow))}.title{font-size:14px;font-weight:620}.sub{font-size:12px;fill:var(--muted)}.note{font-size:12px;fill:var(--muted)}.strong{fill:var(--ink);font-weight:620}.edge{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}.pill-text{font-size:11.5px;font-weight:620}.chip{stroke-width:1}.chip-text{font-size:11px;font-weight:560}.badge-text{font-size:11px;font-weight:700;fill:var(--bg)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--green)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--red)"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="639" rx="18"/>
<text class="h1" x="32" y="46">Tool calls in, letters out</text>
<text class="lede" x="32" y="70">Two paths: a socket into the daemon, messages back through Paseo.</text>
<rect class="group" x="24" y="96" width="912" height="236" rx="14"/>
<text class="group-label" x="40" y="120">TOOL CALLS IN</text>
<rect x="52" y="144" width="142" height="58" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.35"/>
<rect x="48" y="140" width="142" height="58" rx="10" style="fill:var(--slate-fill);stroke:var(--slate);stroke-opacity:0.35"/>
<rect class="node" x="44" y="136" width="142" height="58" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="115.0" y="160.5" text-anchor="middle" style="fill:var(--slate-ink)">each seat</text>
<text class="sub" x="115.0" y="179.5" text-anchor="middle">calls a desk tool</text>
<rect x="234" y="144" width="142" height="58" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.35"/>
<rect x="230" y="140" width="142" height="58" rx="10" style="fill:var(--teal-fill);stroke:var(--teal);stroke-opacity:0.35"/>
<rect class="node" x="226" y="136" width="142" height="58" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="297.0" y="160.5" text-anchor="middle" style="fill:var(--teal-ink)">team.mjs</text>
<text class="sub" x="297.0" y="179.5" text-anchor="middle">one per seat</text>
<rect class="node" x="408" y="136" width="150" height="58" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="483.0" y="160.5" text-anchor="middle" style="fill:var(--teal-ink)">desk.sock</text>
<text class="sub" x="483.0" y="179.5" text-anchor="middle">one line per seat</text>
<rect class="node" x="590" y="136" width="150" height="58" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="665.0" y="160.5" text-anchor="middle" style="fill:var(--teal-ink)">argument check</text>
<text class="sub" x="665.0" y="179.5" text-anchor="middle">against tools.json</text>
<rect class="node" x="772" y="136" width="150" height="58" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="847.0" y="160.5" text-anchor="middle" style="fill:var(--teal-ink)">the verb</text>
<text class="sub" x="847.0" y="179.5" text-anchor="middle">one transaction</text>
<text class="note" x="44" y="304" text-anchor="start">Past 240 s, or when the call is stopped, the answer comes as mail instead.</text>
<rect class="group" x="24" y="352" width="912" height="264" rx="14"/>
<text class="group-label" x="40" y="376">LETTERS OUT</text>
<rect class="node" x="44" y="392" width="170" height="58" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="129.0" y="416.5" text-anchor="middle" style="fill:var(--teal-ink)">desk · patrol</text>
<text class="sub" x="129.0" y="435.5" text-anchor="middle">write every letter</text>
<rect class="node" x="262" y="392" width="170" height="58" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="347.0" y="416.5" text-anchor="middle" style="fill:var(--teal-ink)">outbox.json</text>
<text class="sub" x="347.0" y="435.5" text-anchor="middle">one queue, all seats</text>
<rect class="node" x="480" y="392" width="170" height="58" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="565.0" y="408.0" text-anchor="middle" style="fill:var(--teal-ink)">pump</text>
<text class="sub" x="565.0" y="427.0" text-anchor="middle">new letter, turn end,</text>
<text class="sub" x="565.0" y="444.0" text-anchor="middle">or a patrol round</text>
<rect class="node" x="262" y="486" width="150" height="58" rx="10" style="fill:var(--blue-fill);stroke-opacity:0.55;stroke:var(--blue)"/>
<text class="title" x="337.0" y="510.5" text-anchor="middle" style="fill:var(--blue-ink)">steer</text>
<text class="sub" x="337.0" y="529.5" text-anchor="middle">into a running turn</text>
<rect class="node" x="426" y="486" width="150" height="58" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="501.0" y="510.5" text-anchor="middle" style="fill:var(--slate-ink)">hold</text>
<text class="sub" x="501.0" y="529.5" text-anchor="middle">until it can read</text>
<rect class="node" x="590" y="486" width="150" height="58" rx="10" style="fill:var(--slate-fill);stroke-opacity:0.55;stroke:var(--slate)"/>
<text class="title" x="665.0" y="510.5" text-anchor="middle" style="fill:var(--slate-ink)">keep</text>
<text class="sub" x="665.0" y="529.5" text-anchor="middle">until one asks</text>
<rect class="node" x="754" y="486" width="150" height="58" rx="10" style="fill:var(--blue-fill);stroke-opacity:0.55;stroke:var(--blue)"/>
<text class="title" x="829.0" y="510.5" text-anchor="middle" style="fill:var(--blue-ink)">send</text>
<text class="sub" x="829.0" y="529.5" text-anchor="middle">all at once</text>
<text class="note" x="44" y="578" text-anchor="start">Mail is steered only where the agent can take it and the turn has run 60 s.</text>
<text class="note" x="44" y="595" text-anchor="start">A letter nobody takes in 7 days is dropped.</text>
<path class="edge" d="M194,165 L226,165" style="stroke-opacity:0.75;stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M376,165 L408,165" style="stroke-opacity:0.75;stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M558,165 L590,165" style="stroke-opacity:0.75;stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M740,165 L772,165" style="stroke-opacity:0.75;stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M847,194 L847.0,250.0 Q847,258 839.0,258.0 L309.0,258.0 Q301,258 301.0,250.0 L301,194" style="stroke-opacity:0.75;stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M214,421 L262,421" style="stroke-opacity:0.75;stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M432,421 L480,421" style="stroke-opacity:0.75;stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M565,450 L565.0,460.0 Q565,468 557.0,468.0 L345.0,468.0 Q337,468 337.0,476.0 L337,486" style="stroke-opacity:0.75;stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M565,450 L565.0,460.0 Q565,468 557.0,468.0 L509.0,468.0 Q501,468 501.0,476.0 L501,486" style="stroke-opacity:0.75;stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M565,450 L565.0,460.0 Q565,468 573.0,468.0 L657.0,468.0 Q665,468 665.0,476.0 L665,486" style="stroke-opacity:0.75;stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M565,450 L565.0,460.0 Q565,468 573.0,468.0 L821.0,468.0 Q829,468 829.0,476.0 L829,486" style="stroke-opacity:0.75;stroke:var(--teal)" marker-end="url(#a-teal)"/>
<rect x="499.8" y="248" width="148.3" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="574" y="262" text-anchor="middle" style="fill:var(--teal-ink)">the answer, within 240 s</text>
</svg>
