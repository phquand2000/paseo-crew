<rect x="598.8" y="167.5" width="46.4" height="17.5" rx="4" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="622.0" y="181.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#59636e" text-anchor="middle">500 ms</text>
<text x="32.0" y="246.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">The desk answers within 240 s. A slower result arrives later as a letter, and a repeated call joins the running one.</text>
<line x1="32" y1="270" x2="928" y2="270" stroke="#d8dee4"/>
<text x="32.0" y="302.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">The desk writes to a seat</text>
<rect x="32.0" y="318.0" width="150.0" height="96.0" rx="10" fill="#e0f5f5" stroke="#1b7c83" stroke-width="1.4"/>
<text x="44.0" y="344.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Letter</text>
<text x="44.0" y="365.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">from the desk,</text>
<text x="44.0" y="381.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">patrol or a turn end</text>
<rect x="222.0" y="318.0" width="170.0" height="96.0" rx="10" fill="#ffffff" stroke="#6e7781" stroke-width="1.4"/>
<text x="234.0" y="344.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">outbox.json</text>
<text x="234.0" y="365.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">durable, deduplicated,</text>
<text x="234.0" y="381.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="start">kept up to 7 days</text>
<path d="M182.0,366.0 L222.0,366.0" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#m57606a)"/>
