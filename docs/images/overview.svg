<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img" aria-label="Seatworks inside Paseo: you work in the panel and with a Supervisor seat; the plugin server runs inside the Paseo daemon with its catalog, desk, spool, outbox, patrol and watch; Paseo runs the seats; the watch reads Leads and Peers in code, beside a Watcher seat or, with a key, Jev; everything durable is on disk.">
<title>Seatworks inside Paseo: you work in the panel and with a Supervisor seat; the plugin server runs inside the Paseo daemon with its catalog, desk, spool, outbox, patrol and watch; Paseo runs the seats; the watch reads Leads and Peers in code, beside a Watcher seat or, with a key, Jev; everything durable is on disk.</title>
<style>svg{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--soft:#e6eaef;--ink:#1f2328;--muted:#59636e;--faint:#818b98;--shadow:rgba(31,35,40,0.10);--slate-fill:#f6f8fa;--slate:#8c959f;--slate-ink:#1f2328;--violet-fill:#f7f1ff;--violet:#8250df;--violet-ink:#6639ba;--blue-fill:#eef6ff;--blue:#0969da;--blue-ink:#0550ae;--green-fill:#eefbf1;--green:#1a7f37;--green-ink:#116329;--teal-fill:#ebf9f7;--teal:#0f766e;--teal-ink:#0b5e57;--rose-fill:#fff0f7;--rose:#bf3989;--rose-ink:#99286e;--amber-fill:#fff8e1;--amber:#9a6700;--amber-ink:#7d4e00;--red-fill:#fff1f0;--red:#cf222e;--red-ink:#a40e26;}@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--panel:#151b23;--line:#30363d;--soft:#262c36;--ink:#e6edf3;--muted:#9198a1;--faint:#6e7681;--shadow:rgba(0,0,0,0);--slate-fill:#1c2128;--slate:#6e7681;--slate-ink:#e6edf3;--violet-fill:#231b35;--violet:#a371f7;--violet-ink:#d2a8ff;--blue-fill:#0f2238;--blue:#4493f8;--blue-ink:#79c0ff;--green-fill:#10261a;--green:#3fb950;--green-ink:#7ee787;--teal-fill:#0c2826;--teal:#2bb5a5;--teal-ink:#5eead4;--rose-fill:#2e1424;--rose:#db61a2;--rose-ink:#ff9bce;--amber-fill:#2b2108;--amber:#d29922;--amber-ink:#e3b341;--red-fill:#2d1417;--red:#f85149;--red-ink:#ff7b72;}}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:var(--ink)}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;white-space:pre}.canvas{fill:var(--bg);stroke:var(--line)}.h1{font-size:21px;font-weight:650;letter-spacing:-0.01em}.lede{font-size:13.5px;fill:var(--muted)}.group{fill:var(--panel);stroke:var(--line)}.group-label{font-size:11px;font-weight:650;letter-spacing:0.08em;fill:var(--muted)}.node{stroke-width:1.4;filter:drop-shadow(0 1px 2px var(--shadow))}.title{font-size:14px;font-weight:620}.sub{font-size:12px;fill:var(--muted)}.note{font-size:12px;fill:var(--muted)}.strong{fill:var(--ink);font-weight:620}.edge{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:5 4}.pill-text{font-size:11.5px;font-weight:620}.chip{stroke-width:1}.chip-text{font-size:11px;font-weight:560}.badge-text{font-size:11px;font-weight:700;fill:var(--bg)}.rule{stroke:var(--line);stroke-width:1}</style>
<defs><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--blue)"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--slate)"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--violet)"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--teal)"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--amber)"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" style="fill:var(--rose)"/></marker></defs>
<rect class="canvas" x="0.5" y="0.5" width="959" height="623" rx="18"/>
<text class="h1" x="32" y="46">Seatworks inside Paseo</text>
<text class="lede" x="32" y="70">One plugin inside the daemon, one agent per seat, and a durable record on disk.</text>
<rect class="group" x="24" y="100" width="176" height="340" rx="14"/>
<text class="group-label" x="40" y="124">YOU</text>
<rect class="node" x="38" y="136" width="148" height="60" rx="10" style="fill:var(--blue-fill);stroke:var(--blue)"/>
<text class="title" x="112" y="154" text-anchor="middle" style="fill:var(--blue-ink)">Seatworks panel</text>
<text class="sub" x="112" y="173" text-anchor="middle">Team · Flow</text>
<text class="sub" x="112" y="190" text-anchor="middle">MCP · Health</text>
<rect class="node" x="38" y="220" width="148" height="60" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title" x="112" y="238" text-anchor="middle" style="fill:var(--slate-ink)">Paseo app</text>
<text class="sub" x="112" y="257" text-anchor="middle">talk to the</text>
<text class="sub" x="112" y="274" text-anchor="middle">Supervisor</text>
<text class="note" x="40" y="326" text-anchor="start">The plugin decides</text>
<text class="note" x="40" y="343" text-anchor="start">none of the work.</text>
<text class="note" x="40" y="360" text-anchor="start">The Supervisor does,</text>
<text class="note" x="40" y="377" text-anchor="start">and you answer it.</text>
<rect class="group" x="254" y="100" width="386" height="340" rx="14"/>
<text class="group-label" x="270" y="124">PASEO DAEMON · PLUGIN SERVER</text>
<rect class="node" x="270" y="136" width="354" height="52" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title mono" x="447" y="158.5" text-anchor="middle" style="fill:var(--slate-ink)">runtime.ts</text>
<text class="sub" x="447" y="177.5" text-anchor="middle">hooks · events · RPC · timers</text>
<rect class="node" x="270" y="206" width="170" height="62" rx="10" style="fill:var(--violet-fill);stroke:var(--violet)"/>
<text class="title" x="355" y="225" text-anchor="middle" style="fill:var(--violet-ink)">catalog</text>
<text class="sub" x="355" y="244" text-anchor="middle">providers, seat</text>
<text class="sub" x="355" y="261" text-anchor="middle">directories, content</text>
<rect class="node" x="270" y="282" width="170" height="62" rx="10" style="fill:var(--teal-fill);stroke:var(--teal)"/>
<text class="title" x="355" y="301" text-anchor="middle" style="fill:var(--teal-ink)">desk</text>
<text class="sub" x="355" y="320" text-anchor="middle">lanes · tasks · asks</text>
<text class="sub" x="355" y="337" text-anchor="middle">merges · incidents</text>
<rect class="node" x="270" y="358" width="170" height="62" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title" x="355" y="377" text-anchor="middle" style="fill:var(--slate-ink)">patrol</text>
<text class="sub" x="355" y="396" text-anchor="middle">every 30 s: lanes, asks,</text>
<text class="sub" x="355" y="413" text-anchor="middle">incidents, the Watcher</text>
<rect class="node" x="454" y="206" width="170" height="62" rx="10" style="fill:var(--slate-fill);stroke:var(--slate)"/>
<text class="title" x="539" y="225" text-anchor="middle" style="fill:var(--slate-ink)">spool</text>
<text class="sub" x="539" y="244" text-anchor="middle">tool calls in,</text>
<text class="sub" x="539" y="261" text-anchor="middle">drained every 500 ms</text>
<rect class="node" x="454" y="282" width="170" height="62" rx="10" style="fill:var(--amber-fill);stroke:var(--amber)"/>
<text class="title" x="539" y="301" text-anchor="middle" style="fill:var(--amber-ink)">outbox</text>
<text class="sub" x="539" y="320" text-anchor="middle">letters out: steer,</text>
<text class="sub" x="539" y="337" text-anchor="middle">hold or send</text>
<rect class="node" x="454" y="358" width="170" height="62" rx="10" style="fill:var(--rose-fill);stroke:var(--rose)"/>
<text class="title" x="539" y="377" text-anchor="middle" style="fill:var(--rose-ink)">watch</text>
<text class="sub" x="539" y="396" text-anchor="middle">facts in code, and a</text>
<text class="sub" x="539" y="413" text-anchor="middle">Watcher seat or Jev</text>
<rect class="group" x="730" y="100" width="206" height="340" rx="14"/>
<text class="group-label" x="746" y="124">SEATS</text>
<rect class="node" x="746" y="136" width="174" height="52" rx="10" style="fill:var(--violet-fill);stroke:var(--violet)"/>
<text class="title" x="833" y="158.5" text-anchor="middle" style="fill:var(--violet-ink)">Supervisor</text>
<text class="sub" x="833" y="177.5" text-anchor="middle">works with you</text>
<rect class="node" x="751" y="209" width="168" height="52" rx="10" style="fill:var(--blue-fill);stroke:var(--blue);opacity:0.75"/>
<rect class="node" x="746" y="204" width="168" height="52" rx="10" style="fill:var(--blue-fill);stroke:var(--blue)"/>
<text class="title" x="830" y="226.5" text-anchor="middle" style="fill:var(--blue-ink)">Lead</text>
<text class="sub" x="830" y="245.5" text-anchor="middle">one per lane</text>
<rect class="node" x="751" y="277" width="168" height="52" rx="10" style="fill:var(--green-fill);stroke:var(--green);opacity:0.75"/>
<rect class="node" x="746" y="272" width="168" height="52" rx="10" style="fill:var(--green-fill);stroke:var(--green)"/>
<text class="title" x="830" y="294.5" text-anchor="middle" style="fill:var(--green-ink)">Peer · Reviewer</text>
<text class="sub" x="830" y="313.5" text-anchor="middle">one per task</text>
<rect class="node dash" x="746" y="340" width="174" height="52" rx="10" style="fill:var(--rose-fill);stroke:var(--rose)"/>
<text class="title" x="833" y="362.5" text-anchor="middle" style="fill:var(--rose-ink)">Watcher</text>
<text class="sub" x="833" y="381.5" text-anchor="middle">reads, when by a seat</text>
<text class="note" x="746" y="416" text-anchor="start">each in its own directory</text>
<path class="edge" d="M186,162 L270,162" style="stroke:var(--blue)" marker-end="url(#a-blue)"/>
<path class="edge" d="M186,250 L270,250" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<path class="edge" d="M624,162 L730,162" style="stroke:var(--violet)" marker-end="url(#a-violet)"/>
<path class="edge" d="M730,237 L624,237" style="stroke:var(--teal)" marker-end="url(#a-teal)"/>
<path class="edge" d="M624,313 L730,313" style="stroke:var(--amber)" marker-end="url(#a-amber)"/>
<path class="edge" d="M730,389 L624,389" style="stroke:var(--rose)" marker-end="url(#a-rose)"/>
<rect class="node dash" x="730" y="474" width="206" height="70" rx="10" style="fill:var(--amber-fill);stroke:var(--amber)"/>
<text class="title" x="833" y="497" text-anchor="middle" style="fill:var(--amber-ink)">Jev via OpenRouter</text>
<text class="sub" x="833" y="516" text-anchor="middle">typesafe/jev-1.13, when the</text>
<text class="sub" x="833" y="533" text-anchor="middle">watch is by Jev, with a key</text>
<path class="edge" d="M600,420 L600.0,448.0 Q600,456 608.0,456.0 L677.0,456.0 Q685,456 685.0,464.0 L685.0,501.0 Q685,509 693.0,509.0 L730,509" style="stroke:var(--amber)" marker-end="url(#a-amber)"/>
<rect class="group" x="24" y="474" width="616" height="126" rx="14"/>
<text class="group-label" x="40" y="498">ON DISK</text>
<path class="edge" d="M447,440 L447,474" style="stroke:var(--slate)" marker-end="url(#a-slate)"/>
<text class="note mono" x="40" y="522" text-anchor="start">~/.paseo/config.json</text>
<text class="note mono" x="40" y="541" text-anchor="start">~/.local/share/seatworks-v2/</text>
<text class="note mono" x="40" y="560" text-anchor="start">  settings.json · outbox.json · spool/</text>
<text class="note mono" x="40" y="579" text-anchor="start">  worktrees/ · guides/</text>
<text class="note mono" x="348" y="522" text-anchor="start">projects/&lt;slug&gt;/</text>
<text class="note mono" x="348" y="541" text-anchor="start">  ledger.json · incidents.json</text>
<text class="note mono" x="348" y="560" text-anchor="start">  events.log · assessments/</text>
<text class="note mono" x="348" y="579" text-anchor="start">  CONTEXT.md · status.md</text>
<rect x="209.615" y="152" width="34.769999999999996" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="227" y="166" text-anchor="middle" style="fill:var(--blue-ink)">RPC</text>
<rect x="203.865" y="232.5" width="46.27" height="35" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="227" y="246.5" text-anchor="middle" style="fill:var(--slate-ink)">start</text>
<text class="pill-text" x="227" y="261.5" text-anchor="middle" style="fill:var(--slate-ink)">a seat</text>
<rect x="652.55" y="152" width="64.9" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="685" y="166" text-anchor="middle" style="fill:var(--violet-ink)">providers</text>
<rect x="653.93" y="227" width="62.14" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="685" y="241" text-anchor="middle" style="fill:var(--teal-ink)">tool calls</text>
<rect x="658.76" y="303" width="52.480000000000004" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="685" y="317" text-anchor="middle" style="fill:var(--amber-ink)">letters</text>
<rect x="656.805" y="379" width="56.39" height="20" rx="6" style="fill:var(--bg)"/>
<text class="pill-text" x="685" y="393" text-anchor="middle" style="fill:var(--rose-ink)">timeline</text>
</svg>
