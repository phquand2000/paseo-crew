<text class="sub" x="358.0" y="395.0" text-anchor="middle">every 30 s: lanes,</text>
<text class="sub" x="358.0" y="412.0" text-anchor="middle">asks, incidents</text>
<rect class="node" x="458" y="360" width="176" height="58" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="546.0" y="376.0" text-anchor="middle" style="fill:var(--teal-ink)">watch</text>
<text class="sub" x="546.0" y="395.0" text-anchor="middle">facts in code; questions</text>
<text class="sub" x="546.0" y="412.0" text-anchor="middle">to a model, in shadow</text>
