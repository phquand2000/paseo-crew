<text class="title" x="811.0" y="306.5" text-anchor="middle" style="fill:var(--green-ink)">Peers · Reviewers</text>
<text class="sub" x="811.0" y="325.5" text-anchor="middle">one per task or review</text>
<rect class="node" x="716" y="358" width="190" height="44" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="811.0" y="375.5" text-anchor="middle" style="fill:var(--teal-ink)">Watcher</text>
<text class="sub" x="811.0" y="394.5" text-anchor="middle">one per project</text>
<rect x="724" y="418" width="190" height="44" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.35"/>
<rect x="720" y="414" width="190" height="44" rx="10" style="fill:var(--rose-fill);stroke:var(--rose);stroke-opacity:0.35"/>
<rect class="node" x="716" y="410" width="190" height="44" rx="10" style="fill:var(--rose-fill);stroke-opacity:0.55;stroke:var(--rose)"/>
<text class="title" x="811.0" y="427.5" text-anchor="middle" style="fill:var(--rose-ink)">Pagers</text>
<text class="sub" x="811.0" y="446.5" text-anchor="middle">one per page</text>
