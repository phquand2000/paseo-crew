<text class="title" x="546.0" y="220.0" text-anchor="middle" style="fill:var(--teal-ink)">desk.sock</text>
<text class="sub" x="546.0" y="239.0" text-anchor="middle">tool calls in,</text>
<text class="sub" x="546.0" y="256.0" text-anchor="middle">one line per seat</text>
<rect class="node" x="270" y="282" width="176" height="58" rx="10" style="fill:var(--teal-fill);stroke-opacity:0.55;stroke:var(--teal)"/>
<text class="title" x="358.0" y="298.0" text-anchor="middle" style="fill:var(--teal-ink)">desk</text>
<text class="sub" x="358.0" y="317.0" text-anchor="middle">lanes · tasks · asks</text>
<text class="sub" x="358.0" y="334.0" text-anchor="middle">merges · gates · letters</text>
