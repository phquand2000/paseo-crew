<text class="title" x="358.0" y="220.0" text-anchor="middle" style="fill:var(--teal-ink)">catalog</text>
<text class="sub" x="358.0" y="239.0" text-anchor="middle">providers, seat</text>
<text class="sub" x="358.0" y="256.0" text-anchor="middle">directories, content</text>
