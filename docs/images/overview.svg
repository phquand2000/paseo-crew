<rect x="724" y="295" width="190" height="48" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.35"/>
<rect x="720" y="291" width="190" height="48" rx="10" style="fill:var(--green-fill);stroke:var(--green);stroke-opacity:0.35"/>
